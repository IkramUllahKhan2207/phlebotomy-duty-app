<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C8102E">
<title>Phlebotomist Roster - KIH</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        kihRed: '#C8102E',
        kihBlue: '#1E5BA8'
      }
    }
  }
}
</script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F5F7FA; }
.kih-gradient { background: linear-gradient(135deg, #C8102E 0%, #1E5BA8 100%); }
.cell { display: inline-block; padding: 4px 6px; border-radius: 4px; min-width: 26px; cursor: pointer; font-weight: 700; font-size: 11px; }
.cell-M { background: #FFF3B0; color: #7D6608; }
.cell-E { background: #FFD6A5; color: #7D4A00; }
.cell-E4 { background: #FFC6FF; color: #8E2DE2; }
.cell-N, .cell-N12 { background: #A0C4FF; color: #0B3D91; }
.cell-OFF { background: #E5E5E5; color: #555; }
.cell-D { background: #BDB2FF; color: #4A1D96; }
.cell-X { background: #CAFFBF; color: #1E8449; }
.cell-EL, .cell-CL, .cell-AL { background: #FDFFB6; color: #7D6608; }
.cell-CPL { background: #FFD6A5; color: #7D4A00; }
.cell-SL { background: #FFC9DE; color: #A61E4D; }
.cell-ML { background: #D0BFFF; color: #5F3DC4; }
.cell-GH { background: #FFADAD; color: #922B21; }
.cell-empty { background: #FAFBFD; color: #CCC; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 25px; font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transition: .3s; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; }
.modal-c { background: #fff; border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; }
@media (min-width: 768px) { .modal-bg { align-items: center; } .modal-c { border-radius: 16px; max-width: 700px; } }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; }
.scroll-x table { min-width: max-content; }
input, select, textarea { font-size: 14px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: #C8102E; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 12px; font-size: 10px; font-weight: 600; color: #888; background: none; border: none; cursor: pointer; border-radius: 0; min-width: 60px; white-space: nowrap; }
.nav-btn.active { color: #C8102E; }
.nav-btn .ico { font-size: 18px; }
.pill { display: inline-block; padding: 6px 12px; border-radius: 14px; font-size: 12px; background: #E8EBF2; color: #1E5BA8; margin: 3px; cursor: pointer; font-weight: 600; border: 1.5px solid transparent; }
.pill.on { background: #C8102E; color: #fff; border-color: #C8102E; }
.chat-msg { padding: 10px 14px; border-radius: 16px; margin-bottom: 8px; max-width: 80%; word-wrap: break-word; font-size: 13px; }
.chat-msg.me { background: #C8102E; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
.chat-msg.other { background: #F0F2F5; color: #222; border-bottom-left-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   FIREBASE INIT
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB4uyNiVe5CQ-vAZalcYpQxz2XCq4XY17o",
  authDomain: "phlebotomy-roster-f618f.firebaseapp.com",
  databaseURL: "https://phlebotomy-roster-f618f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "phlebotomy-roster-f618f",
  storageBucket: "phlebotomy-roster-f618f.firebasestorage.app",
  messagingSenderId: "433203658029",
  appId: "1:433203658029:web:bf2a31f75f4c3273df27a4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   GLOBAL STATE
   ============================================================ */
const S = {
  user: null,
  view: 'dashboard',
  periodId: null,
  techPeriodId: null,
  chatWith: null,
  chatType: 'group'
};

/* ============================================================
   HELPERS
   ============================================================ */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return 'id_' + Date.now() + '_' + Math.floor(Math.random() * 1000); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fmtTime(d) { return new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function dayName(d) { const dt = new Date(d + 'T00:00:00'); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]; }
function isSunday(d) { return new Date(d + 'T00:00:00').getDay() === 0; }
function isSaturday(d) { return new Date(d + 'T00:00:00').getDay() === 6; }
function datesBetween(s, e) {
  const out = [];
  const d = new Date(s + 'T00:00:00');
  const end = new Date(e + 'T00:00:00');
  while (d <= end) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function initials(name) {
  return (name || '?').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
}

function toast(msg, type) {
  type = type || 'success';
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type === 'error' ? '#C0392B' : type === 'info' ? '#1E5BA8' : '#27AE60';
  t.style.color = '#fff';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 2800);
}

/* ============================================================
   FIREBASE CACHE
   ============================================================ */
const Cache = {
  data: {},
  listeners: [],
  init() {
    const keys = ['users', 'staff', 'technologists', 'periods', 'assignments',
                  'techPeriods', 'techAssignments', 'leave', 'overtime', 'exchanges',
                  'audit', 'settings', 'notifications', 'chat', 'holidays'];
    keys.forEach(k => {
      db.ref(k).on('value', snap => {
        this.data[k] = snap.val();
        if (k === 'settings' && !this.data[k]) {
          db.ref('settings').set({
            hospital_name: 'KULSUM INTERNATIONAL HOSPITAL',
            department: 'Laboratory and Blood Bank',
            app_title: 'Phlebotomist Roster',
            whatsapp_bot: 'FlipBotMe',
            address: 'Islamabad, Pakistan'
          });
        }
        if (k === 'users' && !this.data[k]) {
          db.ref('users').set({
            admin: {
              username: 'admin',
              password: 'admin123',
              role: 'supervisor',
              active: true,
              mobile: '03001234567',
              name: 'Admin'
            }
          });
        }
        if (S.user) render();
      });
    });
  },
  get(k, def) { return this.data[k] ?? def; },
  set(k, v) {
    this.data[k] = v;
    return db.ref(k).set(v);
  },
  push(k, v) {
    const ref = db.ref(k).push();
    return ref.set(v).then(() => ref.key);
  }
};

/* ============================================================
   AUDIT + NOTIFICATIONS
   ============================================================ */
function audit(action, entity, oldv, newv, reason) {
  const log = Cache.get('audit', {}) || {};
  const arr = Object.values(log);
  const entry = {
    id: uid(),
    user: S.user ? S.user.username : 'system',
    user_name: S.user ? (S.user.name || S.user.username) : 'system',
    action: action,
    entity: entity,
    old: oldv ?? null,
    new: newv ?? null,
    reason: reason || null,
    at: new Date().toISOString()
  };
  arr.unshift(entry);
  const obj = {};
  arr.slice(0, 1000).forEach(x => { obj[x.id] = x; });
  Cache.set('audit', obj);
}

function notifyAll(title, body, type) {
  const notifs = Cache.get('notifications', {}) || {};
  const id = 'n_' + uid();
  notifs[id] = {
    id: id,
    title: title,
    body: body,
    type: type || 'info',
    at: new Date().toISOString(),
    read: false
  };
  Cache.set('notifications', notifs);
}

/* ============================================================
   LOGIN
   ============================================================ */
function renderLogin() {
  const app = $('app');
  app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center p-4 kih-gradient">
      <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <div class="w-20 h-20 mx-auto rounded-2xl kih-gradient flex items-center justify-center text-white font-extrabold text-2xl shadow-lg mb-4">KIH</div>
          <h1 class="text-2xl font-extrabold text-kihRed">Phlebotomist Roster</h1>
          <p class="text-xs font-semibold text-gray-500 tracking-wide mt-1">KULSUM INTERNATIONAL HOSPITAL</p>
        </div>
        <input id="loginUser" type="text" placeholder="Mobile Number / Username" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-3 text-base focus:border-kihRed" autocomplete="username">
        <input id="loginPass" type="password" placeholder="Password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-3 text-base focus:border-kihRed" autocomplete="current-password">
        <button onclick="doLogin()" class="w-full py-3 bg-kihRed text-white rounded-lg font-bold text-base hover:opacity-90">🔐 Login</button>
        <div class="text-center mt-4">
          <button onclick="showForgot()" class="text-kihBlue text-sm font-semibold hover:underline">Forgot Password?</button>
        </div>
        <div class="text-center text-xs text-gray-400 mt-4">Admin: admin / admin123</div>
      </div>
    </div>`;
  $('loginPass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
}

function doLogin() {
  const u = $('loginUser').value.trim();
  const p = $('loginPass').value;
  if (!u || !p) { toast('Enter mobile and password', 'error'); return; }
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(function(x) {
    return (x.username === u || x.mobile === u) && x.password === p;
  });
  if (!user) { toast('Invalid credentials', 'error'); return; }
  if (user.active === false) { toast('Account disabled', 'error'); return; }
  S.user = {
    username: user.username,
    name: user.name || user.username,
    role: user.role,
    staff_id: user.staff_id || null,
    mobile: user.mobile || user.username
  };
  localStorage.setItem('phleb_user', JSON.stringify(S.user));
  S.view = 'dashboard';
  toast('Welcome ' + (user.name || user.username));
  render();
}

function doLogout() {
  if (!confirm('Logout?')) return;
  S.user = null;
  localStorage.removeItem('phleb_user');
  render();
}

function showForgot() {
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `
    <div class="modal-c">
      <h2 class="text-xl font-bold text-kihRed mb-4">🔑 Forgot Password</h2>
      <p class="text-sm text-gray-600 mb-3">Enter your registered mobile number</p>
      <input id="fgMobile" placeholder="Mobile Number" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-3" inputmode="tel">
      <div class="flex gap-2">
        <button onclick="this.closest('.modal-bg').remove()" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold">Cancel</button>
        <button onclick="sendOTP()" class="flex-1 py-3 bg-kihRed text-white rounded-lg font-semibold">Send OTP</button>
      </div>
      <div id="fgStatus" class="mt-3 text-sm"></div>
    </div>`;
  document.body.appendChild(m);
}

function sendOTP() {
  const mobile = $('fgMobile').value.trim();
  if (!mobile) { toast('Enter mobile', 'error'); return; }
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(function(x) {
    return x.username === mobile || x.mobile === mobile;
  });
  if (!user) {
    $('fgStatus').innerHTML = '<span class="text-red-600">Mobile not registered</span>';
    return;
  }
  const otp = String(Math.floor(100000 + Math.random() * 900000));
  sessionStorage.setItem('otp_' + mobile, otp);
  $('fgStatus').innerHTML = `
    <div class="bg-orange-100 p-3 rounded-lg text-orange-700 font-semibold mb-3">
      Demo OTP: <span class="text-xl tracking-widest">${otp}</span>
    </div>
    <input id="fgOTP" placeholder="Enter OTP" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-3" inputmode="numeric" maxlength="6">
    <input id="fgNewPass" type="password" placeholder="New Password (min 6 chars)" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg mb-3">
    <button onclick="verifyOTP('${mobile}')" class="w-full py-3 bg-green-600 text-white rounded-lg font-semibold">Reset Password</button>`;
}

function verifyOTP(mobile) {
  const entered = $('fgOTP').value.trim();
  const newPass = $('fgNewPass').value;
  const savedOTP = sessionStorage.getItem('otp_' + mobile);
  if (entered !== savedOTP) { toast('Invalid OTP', 'error'); return; }
  if (!newPass || newPass.length < 6) { toast('Password must be 6+ chars', 'error'); return; }
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(function(x) {
    return x.username === mobile || x.mobile === mobile;
  });
  user.password = newPass;
  Cache.set('users', users);
  audit('PASSWORD_RESET', 'user', null, mobile);
  sessionStorage.removeItem('otp_' + mobile);
  document.querySelector('.modal-bg').remove();
  toast('Password reset! Login now.');
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  if (!S.user) { renderLogin(); return; }
  const v = S.view;
  let body = '';
  if (v === 'dashboard') body = viewDashboard();
  else if (v === 'roster') body = viewRoster();
  else if (v === 'staff') body = viewStaff();
  else if (v === 'leave') body = viewLeave();
  else if (v === 'overtime') body = viewOvertime();
  else if (v === 'exchange') body = viewExchange();
  else if (v === 'chat') body = viewChat();
  else if (v === 'notifications') body = viewNotifications();
  else if (v === 'reports') body = viewReports();
  else if (v === 'technologist') body = viewTechnologist();
  else if (v === 'audit') body = viewAudit();
  else if (v === 'settings') body = viewSettings();
  else body = '<div class="text-center text-gray-400 p-10">Unknown view</div>';

  const isSup = S.user.role === 'supervisor';
  const navItems = isSup
    ? [['dashboard','🏠','Home'],['roster','📅','Roster'],['staff','👥','Staff'],['technologist','🔬','Techno'],['leave','🏖','Leave'],['exchange','🔄','Exchange'],['overtime','⏱','OT'],['chat','💬','Chat'],['notifications','🔔','Bell'],['reports','📊','Reports'],['audit','📜','Audit'],['settings','⚙','Set']]
    : [['dashboard','🏠','Home'],['roster','📅','Roster'],['leave','🏖','Leave'],['exchange','🔄','Exchange'],['chat','💬','Chat'],['notifications','🔔','Bell']];

  const unreadNum = Object.values(Cache.get('notifications', {}) || {}).filter(n => !n.read).length;

  $('app').innerHTML = `
    <div class="kih-gradient text-white px-4 py-3 flex items-center gap-3 sticky top-0 z-40 shadow-lg">
      <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-kihRed font-extrabold text-sm shrink-0">KIH</div>
      <div class="flex-1 min-w-0">
        <h1 class="text-sm font-bold truncate">${esc((Cache.get('settings', {}) || {}).app_title || 'Phlebotomist Roster')}</h1>
        <div class="text-xs opacity-85">${esc(S.user.name)} · ${isSup ? 'Supervisor' : 'Staff'}</div>
      </div>
      <button onclick="doLogout()" class="bg-white/20 px-3 py-1.5 rounded-lg text-xs font-semibold">Logout</button>
    </div>
    <div class="p-3 max-w-5xl mx-auto" style="padding-bottom: 84px;">${body}</div>
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-100 flex overflow-x-auto z-40 shadow-2xl" style="scrollbar-width:none;">
      ${navItems.map(function(item) {
        const k = item[0], i = item[1], l = item[2];
        const badge = (k === 'notifications' && unreadNum) ? '<span class="bg-kihRed text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1 font-bold">' + unreadNum + '</span>' : '';
        return '<button class="nav-btn ' + (S.view === k ? 'active' : '') + '" onclick="go(\'' + k + '\')"><span class="ico">' + i + '</span>' + l + badge + '</button>';
      }).join('')}
    </nav>`;
}

function go(v) {
  S.view = v;
  render();
  window.scrollTo(0, 0);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function viewDashboard() {
  const staff = Object.values(Cache.get('staff', {}) || {}).filter(s => s.status === 'Active');
  const periods = Object.values(Cache.get('periods', {}) || {});
  const t = today();
  const cp = periods.find(p => p.start <= t && p.end >= t);
  const asg = Cache.get('assignments', {}) || {};
  const lv = Object.values(Cache.get('leave', {}) || {}).filter(l => l.start <= t && l.end >= t && l.status === 'Approved');
  const ex = Object.values(Cache.get('exchanges', {}) || {}).filter(e => e.status === 'Pending');

  let td = {};
  if (cp) {
    const pd = asg[cp.id] || {};
    staff.forEach(s => {
      const c = pd[s.id + '_' + t];
      if (c) td[c] = (td[c] || 0) + 1;
    });
  }

  const sundayHoliday = isSunday(t) || (Object.values(Cache.get('holidays', {}) || {}).some(h => h.date === t && h.active));

  return `
    <div class="grid grid-cols-2 gap-3 mb-3">
      <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-kihRed">
        <div class="text-2xl font-extrabold text-kihBlue">${staff.length}</div>
        <div class="text-xs text-gray-500 font-semibold uppercase mt-1">Active Staff</div>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-green-500">
        <div class="text-2xl font-extrabold text-kihBlue">${lv.length}</div>
        <div class="text-xs text-gray-500 font-semibold uppercase mt-1">On Leave</div>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-orange-500">
        <div class="text-2xl font-extrabold text-kihBlue">${ex.length}</div>
        <div class="text-xs text-gray-500 font-semibold uppercase mt-1">Pending Exchange</div>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-kihBlue">
        <div class="text-2xl font-extrabold text-kihBlue">${Object.values(Cache.get('overtime', {}) || {}).length}</div>
        <div class="text-xs text-gray-500 font-semibold uppercase mt-1">Overtime</div>
      </div>
    </div>
    ${sundayHoliday ? '<div class="bg-orange-50 rounded-xl p-4 mb-3 border border-orange-200"><div class="font-bold text-orange-700 mb-1">🎉 ' + (isSunday(t) ? 'Sunday' : 'Gazetted Holiday') + '</div><div class="text-sm text-orange-600">Today: 5 ON Duty, باقی OFF</div></div>' : ''}
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-2">📅 Current Period</h2>
      ${cp ? '<div class="font-bold text-base">' + esc(cp.name) + '</div><div class="text-xs text-gray-500 mt-1">' + fmtDate(cp.start) + ' → ' + fmtDate(cp.end) + '</div><div class="mt-2"><span class="text-xs font-bold uppercase px-2 py-1 rounded-full ' + (cp.status === 'Published' ? 'bg-green-100 text-green-700' : cp.status === 'Locked' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700') + '">' + cp.status + '</span></div>' : '<div class="text-center text-gray-400 py-6">No active period</div>'}
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="text-kihRed font-bold mb-2">📊 Today's Duties</h2>
      ${Object.keys(td).length ? '<div class="flex flex-wrap gap-2">' + Object.entries(td).map(e => '<span class="cell cell-' + e[0] + '">' + e[0] + ': ' + e[1] + '</span>').join('') + '</div>' : '<div class="text-center text-gray-400 py-6">No duties today</div>'}
    </div>`;
}

/* ============================================================
   STAFF MANAGEMENT
   ============================================================ */
function viewStaff() {
  const staff = Object.values(Cache.get('staff', {}) || {});
  const isSup = S.user.role === 'supervisor';

  return `
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-3">👥 Staff (${staff.length})</h2>
      ${isSup ? '<button onclick="showAddStaff()" class="w-full py-3 bg-green-600 text-white rounded-lg font-bold mb-3">➕ Add New Staff</button>' : ''}
      <div class="border-t border-gray-100 pt-3">
        ${staff.length ? staff.map(s => `
          <div class="flex items-center gap-3 py-3 border-b border-gray-100">
            <div class="w-11 h-11 rounded-full kih-gradient text-white flex items-center justify-center font-bold shrink-0">${initials(s.name)}</div>
            <div class="flex-1 min-w-0">
              <div class="font-bold text-sm truncate">${esc(s.name)}</div>
              <div class="text-xs text-gray-500">${esc(s.designation || 'Phlebotomist')} · 📱 ${esc(s.mobile || '')}</div>

/* ============================================================
   AUTO GENERATE (FIXED - NO SYNTAX ERRORS)
   ============================================================ */
async function autoGenerate() {
  if (!confirm('Auto Generate roster? Existing assignments will be replaced.')) return;

  const periods = Cache.get('periods', {}) || {};
  const p = periods[S.periodId];
  if (!p) return;

  let staff = Object.values(Cache.get('staff', {}) || {}).filter(function(s) {
    return s.status === 'Active';
  });
  if (!staff.length) { toast('No active staff', 'error'); return; }

  const leaves = Object.values(Cache.get('leave', {}) || {}).filter(function(l) {
    return l.status === 'Approved';
  });
  const dates = datesBetween(p.start, p.end);
  const sundaysCount = dates.filter(function(d) { return isSunday(d); }).length;
  const targetOff = sundaysCount;

  const result = {};
  const stats = {};
  staff.forEach(function(s) {
    stats[s.id] = {
      total: 0,
      offCount: 0,
      counts: {},
      lastDate: null
    };
  });

  function onLeave(sid, d) {
    return leaves.find(function(l) {
      return l.staff_id === sid && d >= l.start && d <= l.end;
    });
  }

  function isHol(d) {
    const h = Cache.get('holidays', {}) || {};
    return Object.values(h).some(function(x) { return x.date === d && x.active; });
  }

  function isSunHol(d) {
    return isSunday(d) || isHol(d);
  }

  let lastRotationIdx = 0;

  for (let di = 0; di < dates.length; di++) {
    const date = dates[di];
    const sunHol = isSunHol(date);
    const sat = isSaturday(date) && !sunHol;

    const availStaff = staff.filter(function(s) {
      return !onLeave(s.id, date);
    });

    let offToday = 0;
    if (sunHol) {
      offToday = Math.max(0, availStaff.length - 5);
    } else if (sat) {
      offToday = 2;
    } else {
      const needOff = availStaff.filter(function(s) {
        return stats[s.id].offCount < targetOff;
      });
      if (needOff.length > 0) offToday = 1;
    }

    const offStaffToday = [];
    if (offToday > 0) {
      const candidates = availStaff
        .filter(function(s) { return stats[s.id].offCount < targetOff; })
        .sort(function(a, b) {
          if (stats[a.id].offCount !== stats[b.id].offCount) {
            return stats[a.id].offCount - stats[b.id].offCount;
          }
          return stats[a.id].total - stats[b.id].total;
        });
      for (let i = 0; i < Math.min(offToday, candidates.length); i++) {
        offStaffToday.push(candidates[i].id);
      }
    }

    const assignedToday = {};
    let rule;
    if (sunHol) {
      rule = { M: 2, E: 2, N: 1 };
    } else {
      rule = { M: 3, E: 3, D: 1, N12: 1, E4: 1, X: 1 };
    }

    const queue = [];
    if (sunHol) {
      for (let i = 0; i < rule.N; i++) queue.push('N');
      for (let i = 0; i < rule.M; i++) queue.push('M');
      for (let i = 0; i < rule.E; i++) queue.push('E');
    } else {
      for (let i = 0; i < rule.N12; i++) queue.push('N12');
      for (let i = 0; i < rule.D; i++) queue.push('D');
      for (let i = 0; i < rule.E4; i++) queue.push('E4');
      for (let i = 0; i < rule.X; i++) queue.push('X');
      for (let i = 0; i < rule.M; i++) queue.push('M');
      for (let i = 0; i < rule.E; i++) queue.push('E');
    }

    let gyneeM = false;
    let gyneeE = false;
    const gyneeMNeeded = !sunHol && rule.M > 0;
    const gyneeENeeded = !sunHol && rule.E > 0;

    for (let qi = 0; qi < queue.length; qi++) {
      const code = queue[qi];

      const eligible = availStaff.filter(function(s) {
        if (assignedToday[s.id]) return false;
        if (offStaffToday.indexOf(s.id) !== -1) return false;

        if (code === 'D' && s.gender !== 'Female') return false;
        if ((code === 'N12' || code === 'N') && s.gender !== 'Male') return false;

        if (code === 'M' && gyneeMNeeded && !gyneeM) {
          if (s.gender !== 'Female') return false;
        }
        if (code === 'E' && gyneeENeeded && !gyneeE) {
          if (s.gender !== 'Female') return false;
        }

        if (code === 'E4' && s.gender !== 'Male') {
          const maleAvail = availStaff.some(function(x) {
            return !assignedToday[x.id] &&
                   offStaffToday.indexOf(x.id) === -1 &&
                   x.gender === 'Male';
          });
          if (maleAvail) return false;
        }

        return true;
      });

      eligible.sort(function(a, b) {
        const aC = stats[a.id].counts[code] || 0;
        const bC = stats[b.id].counts[code] || 0;
        if (aC !== bC) return aC - bC;
        return stats[a.id].total - stats[b.id].total;
      });

      if (eligible[0]) {
        const chosen = eligible[0];
        result[chosen.id + '_' + date] = code;
        assignedToday[chosen.id] = true;
        stats[chosen.id].counts[code] = (stats[chosen.id].counts[code] || 0) + 1;
        stats[chosen.id].total++;

        if (code === 'M' && gyneeMNeeded && !gyneeM) gyneeM = true;
        if (code === 'E' && gyneeENeeded && !gyneeE) gyneeE = true;
      }
    }

    staff.forEach(function(s) {
      if (result[s.id + '_' + date]) return;
      const lv = onLeave(s.id, date);
      if (lv) {
        result[s.id + '_' + date] = lv.type || 'EL';
        stats[s.id].offCount++;
      } else if (offStaffToday.indexOf(s.id) !== -1) {
        result[s.id + '_' + date] = 'OFF';
        stats[s.id].offCount++;
      } else {
        result[s.id + '_' + date] = 'OFF';
      }
    });

    if (!sunHol && gyneeMNeeded && !gyneeM) {
      notifyAll('Gynee Alert', fmtDate(date) + ': Gynee M needs Female', 'alert');
    }
    if (!sunHol && gyneeENeeded && !gyneeE) {
      notifyAll('Gynee Alert', fmtDate(date) + ': Gynee E needs Female', 'alert');
    }
  }

  const asg = Cache.get('assignments', {}) || {};
  asg[p.id] = result;
  await Cache.set('assignments', asg);
  audit('GENERATE_ROSTER', 'period', null, Object.keys(result).length + ' assignments');
  notifyAll('Roster Generated', Object.keys(result).length + ' assignments for ' + p.name, 'roster');
  toast('✅ Generated ' + Object.keys(result).length + ' assignments');
  render();
}

async function addOt() {
  const staff_id = $('oStaff').value;
  const date = $('oDate').value;
  const start = $('oStart').value;
  const end = $('oEnd').value;
  const reason = $('oReason').value;
  if (!date || !start || !end) { toast('All required', 'error'); return; }
  const sm = start.split(':').map(Number);
  const em = end.split(':').map(Number);
  let mins = (em[0] * 60 + em[1]) - (sm[0] * 60 + sm[1]);
  if (mins < 0) mins += 24 * 60;
  const hours = +(mins / 60).toFixed(2);
  const cpl = +(hours * 0.125).toFixed(3);
  const ot = Cache.get('overtime', {}) || {};
  const id = 'o_' + uid();
  ot[id] = { id: id, staff_id: staff_id, date: date, start: start, end: end, hours: hours, cpl: cpl, reason: reason, by: S.user.name, at: new Date().toISOString() };
  await Cache.set('overtime', ot);
  const staff = Cache.get('staff', {}) || {};
  const s = staff[staff_id];
  if (s) {
    s.cplBalance = +((s.cplBalance || 0) + cpl).toFixed(3);
    await Cache.set('staff', staff);
  }
  audit('ADD_OT', 'overtime', null, hours + 'h');
  toast('Added ' + hours + 'h (+' + cpl + ' CPL) ✅');
  render();
}

function viewExchange() {
  const ex = Object.values(Cache.get('exchanges', {}) || {});
  const staff = Object.values(Cache.get('staff', {}) || {});
  const isSup = S.user.role === 'supervisor';
  const isStaff = S.user.role === 'staff';

  const mine = isStaff
    ? ex.filter(function(e) { return e.requester_id === S.user.staff_id || e.target_id === S.user.staff_id; })
    : ex;
  const pending = mine.filter(function(e) { return e.status === 'Pending'; });
  const done = mine.filter(function(e) { return e.status !== 'Pending'; });

  function renderEx(e) {
    const req = staff.find(x => x.id === e.requester_id);
    const tgt = staff.find(x => x.id === e.target_id);
    let actions = '';
    if (isStaff && e.target_id === S.user.staff_id && e.staff_resp === 'Pending') {
      actions = '<button onclick="respondX(\'' + e.id + '\',\'Accepted\')" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded font-bold">✅ Accept</button>' +

    } else if (isSup && e.staff_resp === 'Accepted' && e.sup_resp === 'Pending') {
      actions = '<button onclick="approveX(\'' + e.id + '\',\'Approved\')" class="text-xs bg-green-600 text-white px-3 py-1.5 rounded font-bold">✅ Approve</button>' +
                '<button onclick="approveX(\'' + e.id + '\',\'Rejected\')" class="text-xs bg-red-600 text-white px-3 py-1.5 rounded font-bold ml-2">❌ Reject</button>';
    }
    return '<div class="py-3 border-b border-gray-100">' +
      '<div class="font-bold text-sm">' + esc(req ? req.name : '?') + ' ↔ ' + esc(tgt ? tgt.name : '?') + '</div>' +
      '<div class="text-xs text-gray-500">' + fmtDate(e.date) + ' · ' + e.orig + ' ↔ ' + e.req + '</div>' +
      '<div class="mt-1 flex flex-wrap gap-1">' +
      '<span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-100">Staff: ' + e.staff_resp + '</span>' +
      '<span class="text-xs font-bold px-2 py-0.5 rounded bg-gray-100">Sup: ' + e.sup_resp + '</span>' +
      '<span class="text-xs font-bold px-2 py-0.5 rounded-full ' + (e.status === 'Approved' ? 'bg-green-100 text-green-700' : e.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700') + '">' + e.status + '</span>' +
      '</div>' +
      (actions ? '<div class="mt-2">' + actions + '</div>' : '') +
      '</div>';
  }

  return `
    ${isStaff ? `
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-3">🔄 Request Exchange</h2>
      <select id="xTarget" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg mb-2">${staff.filter(s => s.id !== S.user.staff_id).map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('')}</select>
      <input id="xDate" type="date" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg mb-2">
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input id="xOrig" placeholder="My duty" class="px-3 py-2 border-2 border-gray-200 rounded-lg">
        <input id="xReq" placeholder="Their duty" class="px-3 py-2 border-2 border-gray-200 rounded-lg">
      </div>
      <input id="xReason" placeholder="Reason" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg mb-3">
      <button onclick="addExchange()" class="w-full py-3 bg-green-600 text-white rounded-lg font-bold">📤 Submit</button>
    </div>` : ''}
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-3">⏳ Pending (${pending.length})</h2>
      ${pending.length ? pending.map(renderEx).join('') : '<div class="text-center text-gray-400 py-4">No pending</div>'}
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm">
      <h2 class="text-kihRed font-bold mb-3">✅ History (${done.length})</h2>
      ${done.length ? done.slice(0, 20).map(renderEx).join('') : '<div class="text-center text-gray-400 py-4">No history</div>'}
    </div>`;
}

async function addExchange() {
  const target_id = $('xTarget').value;
  const date = $('xDate').value;
  const orig = $('xOrig').value.toUpperCase().trim();
  const req = $('xReq').value.toUpperCase().trim();
  const reason = $('xReason').value.trim();
  if (!date || !orig || !req) { toast('All required', 'error'); return; }
  const ex = Cache.get('exchanges', {}) || {};
  const id = 'x_' + uid();
  ex[id] = {
    id: id,
    requester_id: S.user.staff_id,
    target_id: target_id,
    date: date,
    orig: orig,
    req: req,
    reason: reason,
    staff_resp: 'Pending',
    sup_resp: 'Pending',
    status: 'Pending',
    at: new Date().toISOString()
  };
  await Cache.set('exchanges', ex);
  const staff = Cache.get('staff', {}) || {};
  const requester = staff[S.user.staff_id];
  const target = staff[target_id];
  notifyAll('Exchange Request', (requester ? requester.name : 'Staff') + ' → ' + (target ? target.name : 'Staff') + ' on ' + fmtDate(date), 'exchange');

}

async function respondX(id, resp) {
  const ex = Cache.get('exchanges', {}) || {};
  const e = ex[id];
  if (!e) return;
  e.staff_resp = resp;
  if (resp === 'Rejected') {
    e.status = 'Rejected';
    e.sup_resp = 'Rejected';
  }
  await Cache.set('exchanges', ex);
  toast(resp);
  render();
}

async function approveX(id, resp) {
  const ex = Cache.get('exchanges', {}) || {};
  const e = ex[id];
  if (!e) return;
  e.sup_resp = resp;
  e.status = resp;

  if (resp === 'Approved') {
    const asg = Cache.get('assignments', {}) || {};
    const periods = Cache.get('periods', {}) || {};
    const p = Object.values(periods).find(function(pp) {
      return pp.start <= e.date && pp.end >= e.date;
    });
    if (p && asg[p.id]) {
      const rk = e.requester_id + '_' + e.date;
      const tk = e.target_id + '_' + e.date;
      const rd = asg[p.id][rk] || e.orig;
      const td = asg[p.id][tk] || e.req;
      asg[p.id][rk] = td;
      asg[p.id][tk] = rd;
      await Cache.set('assignments', asg);
    }
  }
  await Cache.set('exchanges', ex);
  const staff = Cache.get('staff', {}) || {};
  const r = staff[e.requester_id];
  const t = staff[e.target_id];
  notifyAll('Exchange ' + resp, (r ? r.name : 'Staff') + ' ↔ ' + (t ? t.name : 'Staff'), 'exchange');
  toast(resp);
  render();
}

async function sendChatMsg(type, roomKey) {

  if (!text) return;
  const chat = Cache.get('chat', {}) || {};

  if (!chat[key]) chat[key] = {};

    id: msgId,
    user: S.user.username,
    user_id: S.user.staff_id || 'admin',
    user_name: S.user.name || S.user.username,
    text: text,
    at: new Date().toISOString()
  };
  await Cache.set('chat', chat);
  input.value = '';
  render();
}

  const s = Cache.get('settings', {}) || {};

  let text = '*' + (s.hospital_name || 'Hospital') + '*\n' + '*' + (s.department || '') + '*\n*Roster:* ' + p.name + '\n\n';

  if (scope === 'staff') {
    const me = staff.find(x => x.id === S.user.staff_id);

    text += '*' + me.name + '* — Your Schedule:\n';
    dates.forEach(function(d) {
      const c = pd[me.id + '_' + d] || '-';
      text += fmtDate(d) + ' (' + dayName(d) + '): *' + c + '*\n';
    });

    text += '*Full Roster:*\n\n';

  const leave = Object.values(Cache.get('leave', {}) || {});
  const ot = Object.values(Cache.get('overtime', {}) || {});
  const ex = Object.values(Cache.get('exchanges', {}) || {});
  const pid = S.periodId || (periods[0] ? periods[0].id : null);
  const p = periods.find(x => x.id === pid);
  const pd = asg[pid] || {};

  let rows = [];
  if (p) {
    const dates = datesBetween(p.start, p.end);
    staff.filter(s => s.status === 'Active').forEach(function(s) {
      const c = { M: 0, E: 0, N: 0, D: 0, X: 0, OFF: 0, CPL: 0, EL: 0, total: 0 };
      dates.forEach(function(d) {
        const code = pd[s.id + '_' + d] || '';
        if (code === 'M') c.M++;
        else if (code === 'E') c.E++;
        else if (code === 'N' || code === 'N12') c.N++;
        else if (code === 'D') c.D++;
        else if (code === 'X') c.X++;
        else if (code === 'OFF') c.OFF++;
        else if (code === 'CPL') c.CPL++;
        else if (code === 'EL') c.EL++;
        if (code) c.total++;
      });
      rows.push(Object.assign({ name: s.name, cplBalance: s.cplBalance || 0 }, c));
    });
  }

  const totalOT = ot.reduce(function(sum, o) { return sum + (o.hours || 0); }, 0);
  const totalOTcpl = ot.reduce(function(sum, o) { return sum + (o.cpl || 0); }, 0);

            <th class="px-1 py-2">N</th><th class="px-1 py-2">D</th><th class="px-1 py-2">X</th>
            <th class="px-1 py-2">OFF</th><th class="px-1 py-2">CPL</th><th class="px-1 py-2">Tot</th>
            <th class="px-1 py-2">CPL Bal</th>
          </tr></thead>
          <tbody>
            ${rows.map(function(r) {
              return '<tr class="border-b border-gray-100">' +
                '<td class="px-2 py-2 text-left font-semibold">' + esc(r.name) + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.M + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.E + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.N + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.D + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.X + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.OFF + '</td>' +
                '<td class="px-1 py-2 text-center">' + r.CPL + '</td>' +
                '<td class="px-1 py-2 text-center font-bold">' + r.total + '</td>' +
                '<td class="px-1 py-2 text-center font-bold text-green-600">' + r.cplBalance.toFixed(2) + '</td>' +
                '</tr>';
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-3">⏱ Overtime Summary</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-green-50 rounded-lg p-3 border-l-4 border-green-500">
          <div class="text-2xl font-bold text-green-700">${totalOT.toFixed(1)}h</div>
          <div class="text-xs text-gray-600 mt-1">Total OT Hours</div>
        </div>
        <div class="bg-orange-50 rounded-lg p-3 border-l-4 border-orange-500">
          <div class="text-2xl font-bold text-orange-700">${totalOTcpl.toFixed(2)}</div>

        </div>

    </div>
    <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
      <h2 class="text-kihRed font-bold mb-3">🏖 Leave Report</h2>
      <div class="scroll-x">
        <table class="w-full text-xs border-collapse">
          <thead><tr class="bg-gradient-to-r from-kihRed to-kihBlue text-white">
            <th class="px-2 py-2 text-left">Staff</th><th class="px-2 py-2">Type</th>
            <th class="px-2 py-2">Start</th><th class="px-2 py-2">End</th><th class="px-2 py-2">Days</th>
          </tr></thead>
          <tbody>
            ${leave.slice(0, 30).map(function(l) {

              return '<tr class="border-b border-gray-100">' +

                '<td class="px-2 py-2 text-center">' + fmtDate(e.date) + '</td>' +
                '<td class="px-2 py-2 text-center"><span class="text-xs font-bold px-2 py-0.5 rounded-full ' + (e.status === 'Approved' ? 'bg-green-100 text-green-700' : e.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700') + '">' + e.status + '</span></td>' +

/* ============================================================
   EXCEL EXPORT
   ============================================================ */
function exportExcel() {
  const periods = Object.values(Cache.get('periods', {}) || {});
  const p = periods.find(x => x.id === S.periodId);
  if (!p) { toast('No period', 'error'); return; }
  const staff = Object.values(Cache.get('staff', {}) || {}).filter(s => s.status === 'Active');
  const dates = datesBetween(p.start, p.end);
  const pd = (Cache.get('assignments', {})[p.id]) || {};
  const settings = Cache.get('settings', {}) || {};

  const aoa = [];
  aoa.push([settings.hospital_name || 'Hospital']);
  aoa.push([(settings.department || '') + ' — Phlebotomist Duty Roster']);
  aoa.push([]);
  aoa.push(['Roster Period:', p.name, '', 'From:', p.start, 'To:', p.end]);
  aoa.push([]);

  const header = ['Sr.', 'Name', 'Mobile'];
  dates.forEach(d => header.push(d.slice(8)));
  header.push('M', 'E', 'E4', 'N12', 'D', 'X', 'OFF', 'CPL', 'TOTAL');
  aoa.push(header);

  staff.forEach(function(s, i) {
    const row = [i + 1, s.name, s.mobile || ''];
    const counts = { M: 0, E: 0, E4: 0, N12: 0, D: 0, X: 0, OFF: 0, CPL: 0 };
    dates.forEach(function(d) {
      const c = pd[s.id + '_' + d] || '';
      row.push(c);
      if (counts[c] !== undefined) counts[c]++;
    });
    const total = dates.filter(d => pd[s.id + '_' + d]).length;
    row.push(counts.M, counts.E, counts.E4, counts.N12, counts.D, counts.X, counts.OFF, counts.CPL, total);
    aoa.push(row);
  });

  aoa.push([]);
  aoa.push(['Generated:', new Date().toLocaleString('en-GB')]);
  aoa.push(['Prepared by:', S.user.name || S.user.username]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Roster');
  XLSX.writeFile(wb, 'roster-' + p.name.replace(/\s+/g, '_') + '.xlsx');
  audit('EXPORT_EXCEL', 'period', null, p.name);
  toast('Excel downloaded ✅');
}

   BOOT
   ============================================================ */
Cache.init();

try {
  const saved = localStorage.getItem('phleb_user');
  if (saved) S.user = JSON.parse(saved);
} catch (e) {
  console.error('Session restore error', e);
}

setTimeout(function() {
  render();
  setInterval(function() {
    if (S.user) render();
  }, 15000);
}, 1200);

</script>
