<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C8102E">
<title>Phlebotomist Roster</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#F5F7FA;color:#222;padding-bottom:70px}
.header{background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.header .logo{width:40px;height:40px;background:#fff;color:#C8102E;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.header h1{font-size:14px;font-weight:700;flex:1}
.header button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.container{padding:12px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{color:#C8102E;font-size:15px;margin-bottom:10px;font-weight:700}
input,select,button{padding:10px 12px;border:1.5px solid #E0E4EB;border-radius:8px;font-size:14px;width:100%;margin-bottom:8px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#C8102E}
button{background:#C8102E;color:#fff;border:none;font-weight:600;cursor:pointer}
button.green{background:#27AE60}
button.blue{background:#1E5BA8}
button.gray{background:#E8EBF2;color:#1E5BA8}
button.small{padding:5px 10px;font-size:12px;width:auto;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff-row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:11px;width:100%}
th,td{border:1px solid #E8EBF2;padding:5px;text-align:center;white-space:nowrap}
th{background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;font-weight:600;position:sticky;top:0}
td.name-cell{text-align:left;font-weight:600;background:#FAFBFD;position:sticky;left:0;z-index:2;min-width:120px}
.cell{display:inline-block;padding:4px 6px;border-radius:4px;font-weight:700;font-size:11px;min-width:26px}
.cM{background:#FFF3B0;color:#7D6608}
.cE{background:#FFD6A5;color:#7D4A00}
.cE4{background:#FFC6FF;color:#8E2DE2}
.cN{background:#A0C4FF;color:#0B3D91}
.cD{background:#BDB2FF;color:#4A1D96}
.cX{background:#CAFFBF;color:#1E8449}
.cOFF{background:#E5E5E5;color:#555}
.cEL,.cCL,.cAL{background:#FDFFB6;color:#7D6608}
.cCPL{background:#FFD6A5;color:#7D4A00}
.cSL{background:#FFC9DE;color:#A61E4D}
.cML{background:#D0BFFF;color:#5F3DC4}
.cGH{background:#FFADAD;color:#922B21}
.c-empty{background:#FAFBFD;color:#CCC}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #F0F2F5;display:flex;overflow-x:auto;z-index:40;box-shadow:0 -3px 12px rgba(0,0,0,.08)}
.nav button{flex:1;background:none;color:#888;border:none;padding:8px 6px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;border-radius:0;margin:0}
.nav button.active{color:#C8102E}
.nav button .ic{font-size:18px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:25px;color:#fff;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
.toast.show{opacity:1}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#C8102E,#1E5BA8)}
.login-box{background:#fff;border-radius:20px;padding:30px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-box .logo-big{width:80px;height:80px;background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 16px}
.login-box h1{text-align:center;color:#C8102E;font-size:20px;font-weight:800;margin-bottom:4px}
.login-box p{text-align:center;color:#666;font-size:11px;font-weight:600;margin-bottom:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB4uyNiVe5CQ-vAZalcYpQxz2XCq4XY17o",
  authDomain: "phlebotomy-roster-f618f.firebaseapp.com",
  databaseURL: "https://phlebotomy-roster-f618f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "phlebotomy-roster-f618f",
  storageBucket: "phlebotomy-roster-f618f.firebasestorage.app",
  messagingSenderId: "433203658029",
  appId: "1:433203658029:web:bf2a31f75f4c3273df27a4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const App = { user: null, view: 'dashboard', periodId: null, cache: {} };

function uid() { return 'x' + Date.now() + Math.floor(Math.random() * 1000); }
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type === 'error' ? '#C0392B' : '#27AE60';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2500);
}
function isSunday(d) { return new Date(d + 'T00:00:00').getDay() === 0; }
function isSaturday(d) { return new Date(d + 'T00:00:00').getDay() === 6; }
function dayName(d) { const dt = new Date(d + 'T00:00:00'); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]; }
function fmtDate(d) { const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); }
function initials(n) { return (n || '?').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase(); }
function datesBetween(s, e) {
  const out = []; const d = new Date(s + 'T00:00:00'); const end = new Date(e + 'T00:00:00');
  while (d <= end) { out.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); }
  return out;
}

/* FIREBASE SYNC */
function initCache() {
  ['users','staff','periods','assignments','leave','holidays','settings','audit'].forEach(k => {
    db.ref(k).on('value', snap => {
      App.cache[k] = snap.val();
      if (k === 'users' && !App.cache[k]) {
        db.ref('users').set({
          admin: { username: 'admin', password: 'admin123', role: 'supervisor', active: true, mobile: '03001234567', name: 'Admin' }
        });
      }
      if (k === 'settings' && !App.cache[k]) {
        db.ref('settings').set({
          hospital_name: 'KULSUM INTERNATIONAL HOSPITAL',
          department: 'Laboratory and Blood Bank',
          app_title: 'Phlebotomist Roster'
        });
      }
      if (App.user) render();
    });
  });
}
function save(k, v) { App.cache[k] = v; return db.ref(k).set(v); }
function get(k, def) { return App.cache[k] !== undefined && App.cache[k] !== null ? App.cache[k] : (def || {}); }
function logAudit(action, oldv, newv) {
  const log = get('audit', {});
  const arr = Object.values(log);
  arr.unshift({ id: uid(), user: App.user ? App.user.username : 'system', action: action, old: oldv, new: newv, at: new Date().toISOString() });
  const obj = {};
  arr.slice(0, 500).forEach(x => { obj[x.id] = x; });
  save('audit', obj);
}

/* LOGIN */
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-bg">
      <div class="login-box">
        <div class="logo-big">KIH</div>
        <h1>Phlebotomist Roster</h1>
        <p>KULSUM INTERNATIONAL HOSPITAL</p>
        <input id="lu" placeholder="Mobile / Username" autocomplete="username">
        <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
        <button onclick="doLogin()">🔐 Login</button>
        <div style="text-align:center;margin-top:14px;font-size:11px;color:#999">Admin: admin / admin123</div>
      </div>
    </div>`;
  document.getElementById('lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
function doLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  if (!u || !p) { toast('Enter credentials', 'error'); return; }
  const users = get('users', {});
  const user = Object.values(users).find(x => (x.username === u || x.mobile === u) && x.password === p);
  if (!user) { toast('Invalid credentials', 'error'); return; }
  App.user = { username: user.username, name: user.name || user.username, role: user.role, staff_id: user.staff_id || null };
  localStorage.setItem('phleb_user', JSON.stringify(App.user));
  App.view = 'dashboard';
  render();
}
function doLogout() {
  if (!confirm('Logout?')) return;
  App.user = null;
  localStorage.removeItem('phleb_user');
  render();
}

/* MAIN RENDER */
function render() {
  if (!App.user) { renderLogin(); return; }
  const v = App.view;
  let body = '';
  if (v === 'dashboard') body = viewDash();
  else if (v === 'roster') body = viewRoster();
  else if (v === 'staff') body = viewStaff();
  else if (v === 'leave') body = viewLeave();
  else if (v === 'audit') body = viewAudit();
  else if (v === 'settings') body = viewSettings();
  else body = '<div class="card">Unknown view</div>';

  const isSup = App.user.role === 'supervisor';
  const nav = isSup
    ? [['dashboard','🏠','Home'],['roster','📅','Roster'],['staff','👥','Staff'],['leave','🏖','Leave'],['audit','📜','Audit'],['settings','⚙','Set']]
    : [['dashboard','🏠','Home'],['roster','📅','Roster'],['leave','🏖','Leave']];

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="logo">KIH</div>
      <h1>${esc((get('settings',{}).app_title) || 'Phlebotomist Roster')}</h1>
      <button onclick="doLogout()">Logout</button>
    </div>
    <div class="container">${body}</div>
    <div class="nav">
      ${nav.map(item => `<button class="${App.view === item[0] ? 'active' : ''}" onclick="App.view='${item[0]}';render()"><span class="ic">${item[1]}</span>${item[2]}</button>`).join('')}
    </div>`;
}

/* DASHBOARD */
function viewDash() {
  const staff = Object.values(get('staff', {})).filter(s => s.status === 'Active');
  const periods = Object.values(get('periods', {}));
  const t = today();
  const cp = periods.find(p => p.start <= t && p.end >= t);
  const asg = get('assignments', {});
  let td = {};
  if (cp && asg[cp.id]) {
    staff.forEach(s => {
      const c = asg[cp.id][s.id + '_' + t];
      if (c) td[c] = (td[c] || 0) + 1;
    });
  }
  return `
    <div class="card">
      <h2>📅 Current Period</h2>
      ${cp ? `<div style="font-weight:700">${esc(cp.name)}</div>
      <div style="color:#666;font-size:12px;margin-top:4px">${fmtDate(cp.start)} → ${fmtDate(cp.end)}</div>
      <div style="margin-top:6px"><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:${cp.status === 'Published' ? '#CAFFBF;color:#1E8449' : '#FFF3B0;color:#7D6608'}">${cp.status}</span></div>`
      : '<div style="text-align:center;color:#999;padding:20px">No active period</div>'}
    </div>
    <div class="card">
      <h2>👥 Staff: ${staff.length} Active</h2>
    </div>
    <div class="card">
      <h2>📊 Today's Duties (${fmtDate(t)})</h2>
      ${Object.keys(td).length ? Object.entries(td).map(([c, n]) => `<span class="cell c${c}">${c}: ${n}</span> `).join('') : '<div style="text-align:center;color:#999;padding:20px">No duties today</div>'}
    </div>`;
}

/* STAFF */
function viewStaff() {
  const staff = Object.values(get('staff', {}));
  const isSup = App.user.role === 'supervisor';
  return `
    <div class="card">
      <h2>👥 Staff (${staff.length})</h2>
      ${isSup ? '<button class="green" onclick="addStaff()">➕ Add New Staff</button>' : ''}
      ${staff.map(s => `
        <div class="staff-row">
          <div class="avatar">${initials(s.name)}</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px">${esc(s.name)}</div>
            <div style="font-size:11px;color:#888">${esc(s.designation || 'Phlebotomist')} · 📱 ${esc(s.mobile || '')}</div>
            <div style="margin-top:3px">
              <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${s.status === 'Active' ? '#E8F5E9;color:#27AE60' : '#FFEBEE;color:#C8102E'}">${s.status}</span>
              <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#F0F2F5;color:#555;margin-left:4px">${esc(s.gender || 'Male')}</span>
            </div>
          </div>
          ${isSup ? `<button class="small gray" onclick="editStaff('${s.id}')">✏️</button>
                     <button class="small ${s.status === 'Active' ? 'red' : 'green'}" style="background:${s.status === 'Active' ? '#C0392B' : '#27AE60'}" onclick="toggleStaff('${s.id}')">${s.status === 'Active' ? '⏸' : '▶'}</button>` : ''}
        </div>`).join('') || '<div style="text-align:center;color:#999;padding:20px">No staff</div>'}
    </div>`;
}

function addStaff() {
  const name = prompt('Staff Name:'); if (!name) return;
  const gender = prompt('Gender (Male/Female):', 'Male'); if (!gender) return;
  const mobile = prompt('Mobile Number:'); if (!mobile) return;
  const empId = prompt('Employee ID:'); if (!empId) return;
  const designation = prompt('Designation:', 'Phlebotomist') || 'Phlebotomist';
  const staff = get('staff', {});
  if (Object.values(staff).find(s => s.mobile === mobile)) { toast('Mobile already registered', 'error'); return; }
  const id = 's_' + uid();
  staff[id] = { id: id, name: name, gender: gender, mobile: mobile, empId: empId, designation: designation, status: 'Active', createdAt: new Date().toISOString() };
  save('staff', staff);
  const users = get('users', {});
  users[mobile] = { username: mobile, password: '123456', role: 'staff', staff_id: id, name: name, mobile: mobile, active: true };
  save('users', users);
  logAudit('CREATE_STAFF', null, name);
  toast('Staff added ✅');
  render();
}

function editStaff(id) {
  const staff = get('staff', {});
  const s = staff[id];
  if (!s) return;
  const name = prompt('Name:', s.name); if (name === null) return;
  const gender = prompt('Gender:', s.gender); if (gender === null) return;
  const mobile = prompt('Mobile:', s.mobile); if (mobile === null) return;
  const empId = prompt('Employee ID:', s.empId); if (empId === null) return;
  const designation = prompt('Designation:', s.designation); if (designation === null) return;
  s.name = name; s.gender = gender; s.mobile = mobile; s.empId = empId; s.designation = designation;
  save('staff', staff);
  logAudit('EDIT_STAFF', null, name);
  toast('Updated ✅');
  render();
}

function toggleStaff(id) {
  const staff = get('staff', {});
  const s = staff[id];
  if (!s) return;
  s.status = s.status === 'Active' ? 'Inactive' : 'Active';
  save('staff', staff);
  toast(s.status);
  render();
}

/* ROSTER */
function viewRoster() {
  const periods = Object.values(get('periods', {})).sort((a, b) => b.start.localeCompare(a.start));
  const isSup = App.user.role === 'supervisor';

  if (!periods.length) {
    if (!isSup) return '<div class="card"><div style="text-align:center;color:#999;padding:20px">No roster</div></div>';
    return `
      <div class="card">
        <h2>📅 Create First Period</h2>
        <input id="pName" placeholder="Name" value="Sep 2026">
        <div class="grid2">
          <input id="pStart" type="date" value="2026-09-01">
          <input id="pEnd" type="date" value="2026-09-30">
        </div>
        <button class="green" onclick="createPeriod()">Create</button>
      </div>`;
  }

  if (!App.periodId) App.periodId = periods[0].id;
  const period = periods.find(p => p.id === App.periodId) || periods[0];
  App.periodId = period.id;

  const staff = Object.values(get('staff', {})).filter(s => s.status === 'Active');
  const dates = datesBetween(period.start, period.end);
  const asg = get('assignments', {});
  const pd = asg[period.id] || {};
  const locked = period.status === 'Locked';

  let html = '<div class="card"><h2>📋 Roster Grid</h2><div class="scroll-x"><table><thead><tr>';
  html += '<th>Name</th>';
  dates.forEach(d => {
    const sun = isSunday(d);
    html += `<th style="${sun ? 'background:#E67E22' : ''}">${d.slice(8)}<br><span style="font-size:9px">${dayName(d)}</span></th>`;
  });
  html += '<th>OFF</th><th>Tot</th></tr></thead><tbody>';

  staff.forEach(s => {
    let off = 0, total = 0;
    html += `<tr><td class="name-cell">${esc(s.name)}</td>`;
    dates.forEach(d => {
      const c = pd[s.id + '_' + d] || '';
      if (c === 'OFF' || c === 'EL' || c === 'CPL' || c === 'CL' || c === 'GH' || c === 'SL' || c === 'AL' || c === 'ML') off++;
      if (c) total++;
      html += `<td onclick="editCell('${s.id}','${d}')"><span class="cell ${c ? 'c' + c : 'c-empty'}">${c || '·'}</span></td>`;
    });
    html += `<td><b>${off}</b></td><td><b>${total}</b></td></tr>`;
  });
  html += '</tbody></table></div></div>';

  const opts = periods.map(p => `<option value="${p.id}" ${p.id === period.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');

  return `
    <div class="card">
      <select onchange="App.periodId=this.value;render()">${opts}</select>
      <div style="font-size:12px;color:#666;margin:8px 0">${fmtDate(period.start)} → ${fmtDate(period.end)} | Status: <b>${period.status}</b></div>
      ${isSup ? `
        <div class="grid2">
          <button class="green" onclick="autoGenerate()">⚡ Auto Generate</button>
          <button class="blue" onclick="exportExcel()">📊 Excel</button>
          <button class="gray" onclick="newPeriod()">➕ New Period</button>
          <button class="gray" onclick="shareWhatsApp()">💬 WhatsApp</button>
        </div>` : ''}
    </div>
    ${html}`;
}

function createPeriod() {
  const name = document.getElementById('pName').value.trim();
  const start = document.getElementById('pStart').value;
  const end = document.getElementById('pEnd').value;
  if (!name || !start || !end) { toast('All fields required', 'error'); return; }
  const id = 'p_' + uid();
  const periods = get('periods', {});
  periods[id] = { id: id, name: name, start: start, end: end, status: 'Draft', created: new Date().toISOString() };
  save('periods', periods);
  App.periodId = id;
  toast('Period created');
  render();
}

function newPeriod() {
  const name = prompt('Period Name:'); if (!name) return;
  const start = prompt('Start Date (YYYY-MM-DD):'); if (!start) return;
  const end = prompt('End Date (YYYY-MM-DD):'); if (!end) return;
  const id = 'p_' + uid();
  const periods = get('periods', {});
  periods[id] = { id: id, name: name, start: start, end: end, status: 'Draft', created: new Date().toISOString() };
  save('periods', periods);
  App.periodId = id;
  toast('Created');
  render();
}

function editCell(staffId, date) {
  if (App.user.role !== 'supervisor') { toast('Only supervisor', 'error'); return; }
  const periods = get('periods', {});
  const period = periods[App.periodId];
  if (!period) return;
  const options = ['M', 'E', 'E4', 'N12', 'N', 'D', 'X', 'OFF', 'EL', 'CPL', 'CL', 'GH', 'SL', 'AL', 'ML'];
  const asg = get('assignments', {});
  const pd = asg[period.id] || {};
  const cur = pd[staffId + '_' + date] || '';
  const choice = prompt('Choose duty:\n' + options.join(', ') + '\n\nCurrent: ' + (cur || 'none'), cur);
  if (!choice) return;
  const code = choice.toUpperCase().trim();
  if (options.indexOf(code) === -1) { toast('Invalid code', 'error'); return; }
  pd[staffId + '_' + date] = code;
  asg[period.id] = pd;
  save('assignments', asg);
  logAudit('EDIT_DUTY', cur, code);
  toast('Updated');
  render();
}

/* AUTO GENERATE */
async function autoGenerate() {
  if (!confirm('Auto Generate roster? Existing assignments will be replaced.')) return;
  const periods = get('periods', {});
  const p = periods[App.periodId];
  if (!p) { toast('No period', 'error'); return; }

  const staff = Object.values(get('staff', {})).filter(s => s.status === 'Active');
  if (!staff.length) { toast('No active staff', 'error'); return; }

  const leaves = Object.values(get('leave', {})).filter(l => l.status === 'Approved');
  const dates = datesBetween(p.start, p.end);
  const sundaysCount = dates.filter(d => isSunday(d)).length;
  const targetOff = sundaysCount;

  const result = {};
  const stats = {};
