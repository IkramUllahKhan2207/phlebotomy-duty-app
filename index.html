<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C8102E">
<title>Phlebotomist Roster</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#F5F7FA;color:#222;padding-bottom:70px}
.header{background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.header .logo{width:40px;height:40px;background:#fff;color:#C8102E;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.header h1{font-size:14px;font-weight:700;flex:1}
.header button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer}
.container{padding:12px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card h2{color:#C8102E;font-size:15px;margin-bottom:10px;font-weight:700}
input,select,button{padding:10px 12px;border:1.5px solid #E0E4EB;border-radius:8px;font-size:14px;width:100%;margin-bottom:8px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#C8102E}
button{background:#C8102E;color:#fff;border:none;font-weight:600;cursor:pointer}
button.green{background:#27AE60}
button.blue{background:#1E5BA8}
button.gray{background:#E8EBF2;color:#1E5BA8}
button.red{background:#C0392B}
button.small{padding:5px 10px;font-size:12px;width:auto;margin:0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.staff-row{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:11px;width:100%}
th,td{border:1px solid #E8EBF2;padding:5px;text-align:center;white-space:nowrap}
th{background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;font-weight:600;position:sticky;top:0}
td.name-cell{text-align:left;font-weight:600;background:#FAFBFD;position:sticky;left:0;z-index:2;min-width:120px}
.cell{display:inline-block;padding:4px 6px;border-radius:4px;font-weight:700;font-size:11px;min-width:26px}
.cM{background:#FFF3B0;color:#7D6608}
.cE{background:#FFD6A5;color:#7D4A00}
.cE4{background:#FFC6FF;color:#8E2DE2}
.cN{background:#A0C4FF;color:#0B3D91}
.cN12{background:#A0C4FF;color:#0B3D91}
.cD{background:#BDB2FF;color:#4A1D96}
.cX{background:#CAFFBF;color:#1E8449}
.cOFF{background:#E5E5E5;color:#555}
.cEL{background:#FDFFB6;color:#7D6608}
.cCL{background:#FDFFB6;color:#7D6608}
.cAL{background:#FDFFB6;color:#7D6608}
.cCPL{background:#FFD6A5;color:#7D4A00}
.cSL{background:#FFC9DE;color:#A61E4D}
.cML{background:#D0BFFF;color:#5F3DC4}
.cGH{background:#FFADAD;color:#922B21}
.c-empty{background:#FAFBFD;color:#CCC}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #F0F2F5;display:flex;overflow-x:auto;z-index:40;box-shadow:0 -3px 12px rgba(0,0,0,.08)}
.nav button{flex:1;background:none;color:#888;border:none;padding:8px 6px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;border-radius:0;margin:0}
.nav button.active{color:#C8102E}
.nav button .ic{font-size:18px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:25px;color:#fff;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center;background:#27AE60}
.toast.show{opacity:1}
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#C8102E,#1E5BA8)}
.login-box{background:#fff;border-radius:20px;padding:30px 24px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-box .logo-big{width:80px;height:80px;background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 16px}
.login-box h1{text-align:center;color:#C8102E;font-size:20px;font-weight:800;margin-bottom:4px}
.login-box p{text-align:center;color:#666;font-size:11px;font-weight:600;margin-bottom:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyB4uyNiVe5CQ-vAZalcYpQxz2XCq4XY17o",
  authDomain: "phlebotomy-roster-f618f.firebaseapp.com",
  databaseURL: "https://phlebotomy-roster-f618f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "phlebotomy-roster-f618f",
  storageBucket: "phlebotomy-roster-f618f.firebasestorage.app",
  messagingSenderId: "433203658029",
  appId: "1:433203658029:web:bf2a31f75f4c3273df27a4"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var App = { user: null, view: 'dashboard', periodId: null, cache: {} };

function uid() { return 'x' + Date.now() + Math.floor(Math.random() * 1000); }
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    if (c === '&') return '&amp;';
    if (c === '<') return '&lt;';
    if (c === '>') return '&gt;';
    if (c === '"') return '&quot;';
    return '&#39;';
  });
}
function toast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast';
  if (type === 'error') t.style.background = '#C0392B';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.classList.add('show'); }, 20);
  setTimeout(function() {
    t.classList.remove('show');
    setTimeout(function() { t.remove(); }, 300);
  }, 2500);
}
function isSunday(d) { return new Date(d + 'T00:00:00').getDay() === 0; }
function isSaturday(d) { return new Date(d + 'T00:00:00').getDay() === 6; }
function dayName(d) {
  var dt = new Date(d + 'T00:00:00');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
}
function fmtDate(d) {
  var dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function initials(n) {
  if (!n) return '?';
  var parts = n.split(' ');
  var result = '';
  for (var i = 0; i < Math.min(2, parts.length); i++) {
    if (parts[i]) result += parts[i][0];
  }
  return result.toUpperCase();
}
function datesBetween(s, e) {
  var out = [];
  var d = new Date(s + 'T00:00:00');
  var end = new Date(e + 'T00:00:00');
  while (d <= end) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function initCache() {
  var keys = ['users', 'staff', 'periods', 'assignments', 'leave', 'holidays', 'settings', 'audit'];
  keys.forEach(function(k) {
    db.ref(k).on('value', function(snap) {
      App.cache[k] = snap.val();
      if (k === 'users' && !App.cache[k]) {
        db.ref('users').set({
          admin: {
            username: 'admin',
            password: 'admin123',
            role: 'supervisor',
            active: true,
            mobile: '03001234567',
            name: 'Admin'
          }
        });
      }
      if (k === 'settings' && !App.cache[k]) {
        db.ref('settings').set({
          hospital_name: 'KULSUM INTERNATIONAL HOSPITAL',
          department: 'Laboratory and Blood Bank',
          app_title: 'Phlebotomist Roster'
        });
      }
      if (App.user) render();
    });
  });
}
function save(k, v) {
  App.cache[k] = v;
  return db.ref(k).set(v);
}
function get(k, def) {
  if (App.cache[k] !== undefined && App.cache[k] !== null) return App.cache[k];
  return def || {};
}
function logAudit(action, oldv, newv) {
  var log = get('audit', {});
  var arr = Object.values(log);
  arr.unshift({
    id: uid(),
    user: App.user ? App.user.username : 'system',
    action: action,
    old: oldv,
    new: newv,
    at: new Date().toISOString()
  });
  var obj = {};
  arr.slice(0, 500).forEach(function(x) { obj[x.id] = x; });
  save('audit', obj);
}

function renderLogin() {
  document.getElementById('app').innerHTML =
    '<div class="login-bg"><div class="login-box">' +
    '<div class="logo-big">KIH</div>' +
    '<h1>Phlebotomist Roster</h1>' +
    '<p>KULSUM INTERNATIONAL HOSPITAL</p>' +
    '<input id="lu" placeholder="Mobile / Username" autocomplete="username">' +
    '<input id="lp" type="password" placeholder="Password" autocomplete="current-password">' +
    '<button onclick="doLogin()">🔐 Login</button>' +
    '<div style="text-align:center;margin-top:14px;font-size:11px;color:#999">Admin: admin / admin123</div>' +
    '</div></div>';
  document.getElementById('lp').onkeydown = function(e) {
    if (e.key === 'Enter') doLogin();
  };
}

function doLogin() {
  var u = document.getElementById('lu').value.trim();
  var p = document.getElementById('lp').value;
  if (!u || !p) { toast('Enter credentials', 'error'); return; }
  var users = get('users', {});
  var user = Object.values(users).find(function(x) {
    return (x.username === u || x.mobile === u) && x.password === p;
  });
  if (!user) { toast('Invalid credentials', 'error'); return; }
  App.user = {
    username: user.username,
    name: user.name || user.username,
    role: user.role,
    staff_id: user.staff_id || null
  };
  localStorage.setItem('phleb_user', JSON.stringify(App.user));
  App.view = 'dashboard';
  render();
}

function doLogout() {
  if (!confirm('Logout?')) return;
  App.user = null;
  localStorage.removeItem('phleb_user');
  render();
}

function render() {
  if (!App.user) { renderLogin(); return; }
  var v = App.view;
  var body = '';
  if (v === 'dashboard') body = viewDash();
  else if (v === 'roster') body = viewRoster();
  else if (v === 'staff') body = viewStaff();
  else if (v === 'leave') body = viewLeave();
  else if (v === 'audit') body = viewAudit();
  else if (v === 'settings') body = viewSettings();
  else body = '<div class="card">Unknown view</div>';

  var isSup = App.user.role === 'supervisor';
  var nav = isSup
    ? [['dashboard','🏠','Home'],['roster','📅','Roster'],['staff','👥','Staff'],['leave','🏖','Leave'],['audit','📜','Audit'],['settings','⚙','Set']]
    : [['dashboard','🏠','Home'],['roster','📅','Roster'],['leave','🏖','Leave']];

  var navHtml = nav.map(function(item) {
    var cls = App.view === item[0] ? 'active' : '';
    return '<button class="' + cls + '" onclick="App.view=\'' + item[0] + '\';render()"><span class="ic">' + item[1] + '</span>' + item[2] + '</button>';
  }).join('');

  var title = 'Phlebotomist Roster';
  var st = get('settings', {});
  if (st.app_title) title = st.app_title;

  document.getElementById('app').innerHTML =
    '<div class="header">' +
    '<div class="logo">KIH</div>' +
    '<h1>' + esc(title) + '</h1>' +
    '<button onclick="doLogout()">Logout</button>' +
    '</div>' +
    '<div class="container">' + body + '</div>' +
    '<div class="nav">' + navHtml + '</div>';
}

function viewDash() {
  var staff = Object.values(get('staff', {})).filter(function(s) { return s.status === 'Active'; });
  var periods = Object.values(get('periods', {}));
  var t = today();
  var cp = periods.find(function(p) { return p.start <= t && p.end >= t; });
  var asg = get('assignments', {});
  var td = {};
  if (cp && asg[cp.id]) {
    staff.forEach(function(s) {
      var c = asg[cp.id][s.id + '_' + t];
      if (c) td[c] = (td[c] || 0) + 1;
    });
  }

  var periodHtml = '<div style="text-align:center;color:#999;padding:20px">No active period</div>';
  if (cp) {
    var badgeColor = cp.status === 'Published' ? 'background:#CAFFBF;color:#1E8449' : 'background:#FFF3B0;color:#7D6608';
    periodHtml = '<div style="font-weight:700">' + esc(cp.name) + '</div>' +
      '<div style="color:#666;font-size:12px;margin-top:4px">' + fmtDate(cp.start) + ' → ' + fmtDate(cp.end) + '</div>' +
      '<div style="margin-top:6px"><span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;' + badgeColor + '">' + cp.status + '</span></div>';
  }

  var dutyHtml = '<div style="text-align:center;color:#999;padding:20px">No duties today</div>';
  var tdKeys = Object.keys(td);
  if (tdKeys.length) {
    dutyHtml = tdKeys.map(function(c) {
      return '<span class="cell c' + c + '">' + c + ': ' + td[c] + '</span> ';
    }).join('');
  }

  return '<div class="card"><h2>📅 Current Period</h2>' + periodHtml + '</div>' +
    '<div class="card"><h2>👥 Staff: ' + staff.length + ' Active</h2></div>' +
    '<div class="card"><h2>📊 Today\'s Duties (' + fmtDate(t) + ')</h2>' + dutyHtml + '</div>';
}

function viewStaff() {
  var staff = Object.values(get('staff', {}));
  var isSup = App.user.role === 'supervisor';
  var html = '<div class="card"><h2>👥 Staff (' + staff.length + ')</h2>';
  if (isSup) html += '<button class="green" onclick="addStaff()">➕ Add New Staff</button>';
  if (!staff.length) {
    html += '<div style="text-align:center;color:#999;padding:20px">No staff</div>';
  } else {
    staff.forEach(function(s) {
      var statusStyle = s.status === 'Active' ? 'background:#E8F5E9;color:#27AE60' : 'background:#FFEBEE;color:#C8102E';
      html += '<div class="staff-row">' +
        '<div class="avatar">' + initials(s.name) + '</div>' +
        '<div style="flex:1">' +
        '<div style="font-weight:700;font-size:14px">' + esc(s.name) + '</div>' +
        '<div style="font-size:11px;color:#888">' + esc(s.designation || 'Phlebotomist') + ' · 📱 ' + esc(s.mobile || '') + '</div>' +
        '<div style="margin-top:3px">' +
        '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;' + statusStyle + '">' + s.status + '</span> ' +
        '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#F0F2F5;color:#555">' + esc(s.gender || 'Male') + '</span>' +
        '</div></div>';
      if (isSup) {
        html += '<button class="small gray" onclick="editStaff(\'' + s.id + '\')">✏️</button>';
        var toggleCls = s.status === 'Active' ? 'red' : 'green';
        var toggleLabel = s.status === 'Active' ? '⏸' : '▶';
        html += '<button class="small ' + toggleCls + '" onclick="toggleStaff(\'' + s.id + '\')">' + toggleLabel + '</button>';
      }
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function addStaff() {
  var name = prompt('Staff Name:');
  if (!name) return;
  var gender = prompt('Gender (Male/Female):', 'Male');
  if (!gender) return;
  var mobile = prompt('Mobile Number:');
  if (!mobile) return;
  var empId = prompt('Employee ID:');
  if (!empId) return;
  var designation = prompt('Designation:', 'Phlebotomist') || 'Phlebotomist';
  var staff = get('staff', {});
  var exists = Object.values(staff).find(function(s) { return s.mobile === mobile; });
  if (exists) { toast('Mobile already registered', 'error'); return; }
  var id = 's_' + uid();
  staff[id] = {
    id: id,
    name: name,
    gender: gender,
    mobile: mobile,
    empId: empId,
    designation: designation,
    status: 'Active',
    createdAt: new Date().toISOString()
  };
  save('staff', staff);
  var users = get('users', {});
  users[mobile] = {
    username: mobile,
    password: '123456',
    role: 'staff',
    staff_id: id,
    name: name,
    mobile: mobile,
    active: true
  };
  save('users', users);
  logAudit('CREATE_STAFF', null, name);
  toast('Staff added ✅');
  render();
}

function editStaff(id) {
  var staff = get('staff', {});
  var s = staff[id];
  if (!s) return;
  var name = prompt('Name:', s.name);
  if (name === null) return;
  var gender = prompt('Gender:', s.gender);
  if (gender === null) return;
  var mobile = prompt('Mobile:', s.mobile);
  if (mobile === null) return;
  var empId = prompt('Employee ID:', s.empId);
  if (empId === null) return;
  var designation = prompt('Designation:', s.designation);
  if (designation === null) return;
  s.name = name;
  s.gender = gender;
  s.mobile = mobile;
  s.empId = empId;
  s.designation = designation;
  save('staff', staff);
  logAudit('EDIT_STAFF', null, name);
  toast('Updated ✅');
  render();
}

function toggleStaff(id) {
  var staff = get('staff', {});
  var s = staff[id];
  if (!s) return;
  s.status = s.status === 'Active' ? 'Inactive' : 'Active';
  save('staff', staff);
  toast(s.status);
  render();
}

function viewRoster() {
  var periods = Object.values(get('periods', {})).sort(function(a, b) {
    return b.start.localeCompare(a.start);
  });
  var isSup = App.user.role === 'supervisor';

  if (!periods.length) {
    if (!isSup) return '<div class="card"><div style="text-align:center;color:#999;padding:20px">No roster</div></div>';
    return '<div class="card"><h2>📅 Create First Period</h2>' +
      '<input id="pName" placeholder="Name" value="Sep 2026">' +
      '<div class="grid2">' +
      '<input id="pStart" type="date" value="2026-09-01">' +
      '<input id="pEnd" type="date" value="2026-09-30">' +
      '</div>' +
      '<button class="green" onclick="createPeriod()">Create</button>' +
      '</div>';
  }

  if (!App.periodId) App.periodId = periods[0].id;
  var period = periods.find(function(p) { return p.id === App.periodId; }) || periods[0];
  App.periodId = period.id;

  var staff = Object.values(get('staff', {})).filter(function(s) { return s.status === 'Active'; });
  var dates = datesBetween(period.start, period.end);
  var asg = get('assignments', {});
  var pd = asg[period.id] || {};

  var gridHtml = '<div class="card"><h2>📋 Roster Grid</h2><div class="scroll-x"><table><thead><tr>';
  gridHtml += '<th>Name</th>';
  dates.forEach(function(d) {
    var sun = isSunday(d);
    var style = sun ? ' style="background:#E67E22"' : '';
    gridHtml += '<th' + style + '>' + d.slice(8) + '<br><span style="font-size:9px">' + dayName(d) + '</span></th>';
  });
  gridHtml += '<th>OFF</th><th>Tot</th></tr></thead><tbody>';

  staff.forEach(function(s) {
    var off = 0;
    var total = 0;
    gridHtml += '<tr><td class="name-cell">' + esc(s.name) + '</td>';
    dates.forEach(function(d) {
      var c = pd[s.id + '_' + d] || '';
      if (c === 'OFF' || c === 'EL' || c === 'CPL' || c === 'CL' || c === 'GH' || c === 'SL' || c === 'AL' || c === 'ML') off++;
      if (c) total++;
      var cls = c ? 'c' + c : 'c-empty';
      gridHtml += '<td onclick="editCell(\'' + s.id + '\',\'' + d + '\')"><span class="cell ' + cls + '">' + (c || '·') + '</span></td>';
    });
    gridHtml += '<td><b>' + off + '</b></td><td><b>' + total + '</b></td></tr>';
  });
  gridHtml += '</tbody></table></div></div>';

  var opts = periods.map(function(p) {
    var sel = p.id === period.id ? ' selected' : '';
    return '<option value="' + p.id + '"' + sel + '>' + esc(p.name) + '</option>';
  }).join('');

  var actions = '';
  if (isSup) {
    actions = '<div class="grid2">' +
      '<button class="green" onclick="autoGenerate()">⚡ Auto Generate</button>' +
      '<button class="blue" onclick="exportExcel()">📊 Excel</button>' +
      '<button class="gray" onclick="newPeriod()">➕ New Period</button>' +
      '<button class="gray" onclick="shareWhatsApp()">💬 WhatsApp</button>' +
      '</div>';
  }

  return '<div class="card">' +
    '<select onchange="App.periodId=this.value;render()">' + opts + '</select>' +
    '<div style="font-size:12px;color:#666;margin:8px 0">' + fmtDate(period.start) + ' → ' + fmtDate(period.end) + ' | Status: <b>' + period.status + '</b></div>' +
    actions +
    '</div>' + gridHtml;
}

function createPeriod() {
  var name = document.getElementById('pName').value.trim();
  var start = document.getElementById('pStart').value;
  var end = document.getElementById('pEnd').value;
  if (!name || !start || !end) { toast('All fields required', 'error'); return; }
  var id = 'p_' + uid();
  var periods = get('periods', {});
  periods[id] = {
    id: id,
    name: name,
    start: start,
    end: end,
    status: 'Draft',
    created: new Date().toISOString()
  };
  save('periods', periods);
  App.periodId = id;
  toast('Period created');
  render();
}

function newPeriod() {
  var name = prompt('Period Name:');
  if (!name) return;
  var start = prompt('Start Date (YYYY-MM-DD):');
  if (!start) return;
  var end = prompt('End Date (YYYY-MM-DD):');
  if (!end) return;
  var id = 'p_' + uid();
  var periods = get('periods', {});
  periods[id] = {
    id: id,
    name: name,
    start: start,
    end: end,
    status: 'Draft',
    created: new Date().toISOString()
  };
  save('periods', periods);
  App.periodId = id;
  toast('Created');

}

function editCell(staffId, date) {
  if (App.user.role !== 'supervisor') { toast('Only supervisor', 'error'); return; }
  var periods = get('periods', {});
  var period = periods[App.periodId];
  if (!period) return;
  var options = ['M', 'E', 'E4', 'N12', 'N', 'D', 'X', 'OFF', 'EL', 'CPL', 'CL', 'GH', 'SL', 'AL', 'ML'];
  var asg = get('assignments', {});
  var pd = asg[period.id] || {};
  var cur = pd[staffId + '_' + date] || '';
  var choice = prompt('Choose duty:\n' + options.join(', ') + '\n\nCurrent: ' + (cur || 'none'), cur);
  if (!choice) return;
  var code = choice.toUpperCase().trim();
  if (options.indexOf(code) === -1) { toast('Invalid code', 'error'); return; }
  pd[staffId + '_' + date] = code;
  asg[period.id] = pd;
  save('assignments', asg);
  logAudit('EDIT_DUTY', cur, code);
  toast('Updated');
  render();
}

function autoGenerate() {
  if (!confirm('Auto Generate roster? Existing assignments will be replaced.')) return;

  var periods = get('periods', {});
  var p = periods[App.periodId];
  if (!p) { toast('No period', 'error'); return; }

  var staff = Object.values(get('staff', {})).filter(function(s) {
    return s.status === 'Active';
  });
  if (!staff.length) { toast('No active staff', 'error'); return; }

  var leaves = Object.values(get('leave', {})).filter(function(l) {
    return l.status === 'Approved';
  });
  var dates = datesBetween(p.start, p.end);
  var sundaysCount = dates.filter(function(d) { return isSunday(d); }).length;
  var targetOff = sundaysCount;

  var result = {};
  var stats = {};
  staff.forEach(function(s) {
    stats[s.id] = {
      offCount: 0,
      counts: {},
      total: 0
    };
  });

  for (var i = 0; i < dates.length; i++) {
    var date = dates[i];
    var sun = isSunday(date);
    var sat = isSaturday(date) && !sun;

    var availStaff = staff.filter(function(s) {
      var onLv = leaves.find(function(l) {
        return l.staff_id === s.id && date >= l.start && date <= l.end;
      });
      return !onLv;
    });

    var offToday = 0;
    if (sun) {
      offToday = Math.max(0, availStaff.length - 5);
    } else if (sat) {
      offToday = 2;
    } else {
      var needOff = availStaff.filter(function(s) {
        return stats[s.id].offCount < targetOff;
      });
      if (needOff.length > 0) offToday = 1;
    }

    var offStaffIds = [];
    if (offToday > 0) {
      var candidates = availStaff
        .filter(function(s) { return stats[s.id].offCount < targetOff; })
        .sort(function(a, b) {
          return stats[a.id].offCount - stats[b.id].offCount;
        });
      for (var j = 0; j < Math.min(offToday, candidates.length); j++) {
        offStaffIds.push(candidates[j].id);
      }
    }

    var assigned = {};
    var rule;
    if (sun) {
      rule = { M: 2, E: 2, N: 1 };
    } else {
      rule = { M: 3, E: 3, D: 1, N12: 1, E4: 1, X: 1 };
    }

    var queue = [];
    if (sun) {
      for (var n1 = 0; n1 < rule.N; n1++) queue.push('N');
      for (var n2 = 0; n2 < rule.M; n2++) queue.push('M');
      for (var n3 = 0; n3 < rule.E; n3++) queue.push('E');
    } else {
      for (var n4 = 0; n4 < rule.N12; n4++) queue.push('N12');
      for (var n5 = 0; n5 < rule.D; n5++) queue.push('D');
      for (var n6 = 0; n6 < rule.E4; n6++) queue.push('E4');
      for (var n7 = 0; n7 < rule.X; n7++) queue.push('X');
      for (var n8 = 0; n8 < rule.M; n8++) queue.push('M');
      for (var n9 = 0; n9 < rule.E; n9++) queue.push('E');
    }

    var gyneeM = false;
    var gyneeE = false;

    for (var q = 0; q < queue.length; q++) {
      var code = queue[q];
      var eligible = availStaff.filter(function(s) {
        if (assigned[s.id]) return false;
        if (offStaffIds.indexOf(s.id) !== -1) return false;
        if (code === 'D' && s.gender !== 'Female') return false;
        if ((code === 'N12' || code === 'N') && s.gender !== 'Male') return false;
        if (code === 'M' && !sun && rule.M > 0 && !gyneeM && s.gender !== 'Female') {
          var femAvailM = availStaff.some(function(x) {
            return !assigned[x.id] && offStaffIds.indexOf(x.id) === -1 && x.gender === 'Female';
          });
          if (femAvailM) return false;
        }
        if (code === 'E' && !sun && rule.E > 0 && !gyneeE && s.gender !== 'Female') {
          var femAvailE = availStaff.some(function(x) {
            return !assigned[x.id] && offStaffIds.indexOf(x.id) === -1 && x.gender === 'Female';
          });
          if (femAvailE) return false;
        }
        return true;
      });

      eligible.sort(function(a, b) {
        var aC = stats[a.id].counts[code] || 0;
        var bC = stats[b.id].counts[code] || 0;
        if (aC !== bC) return aC - bC;
        return stats[a.id].total - stats[b.id].total;
      });

      if (eligible[0]) {
        var ch = eligible[0];
        result[ch.id + '_' + date] = code;
        assigned[ch.id] = true;
        stats[ch.id].counts[code] = (stats[ch.id].counts[code] || 0) + 1;
        stats[ch.id].total++;
        if (code === 'M' && !sun && !gyneeM) gyneeM = true;
        if (code === 'E' && !sun && !gyneeE) gyneeE = true;
      }
    }

    staff.forEach(function(s) {
      if (result[s.id + '_' + date]) return;
      var lv = leaves.find(function(l) {
        return l.staff_id === s.id && date >= l.start && date <= l.end;
      });
      if (lv) {
        result[s.id + '_' + date] = lv.type || 'EL';
        stats[s.id].offCount++;
      } else if (offStaffIds.indexOf(s.id) !== -1) {
        result[s.id + '_' + date] = 'OFF';
        stats[s.id].offCount++;
      } else {
        result[s.id + '_' + date] = 'OFF';
      }
    });
  }

  var asg = get('assignments', {});
  asg[p.id] = result;
  save('assignments', asg);
  logAudit('GENERATE_ROSTER', null, Object.keys(result).length + ' assignments');
  toast('✅ Generated ' + Object.keys(result).length + ' assignments');
  render();
}

function viewLeave() {
  var leave = Object.values(get('leave', {}));
  var staff = Object.values(get('staff', {}));
  var isSup = App.user.role === 'supervisor';

  var html = '';
  if (isSup) {
    var staffOpts = staff.map(function(s) {
      return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
    }).join('');
    html += '<div class="card"><h2>🏖 Add Leave</h2>' +
      '<select id="lStaff">' + staffOpts + '</select>' +
      '<select id="lType">' +
      '<option>EL</option><option>CPL</option><option>CL</option><option>GH</option>' +
      '<option>SL</option><option>AL</option><option>ML</option><option>OFF</option>' +
      '</select>' +
      '<div class="grid2">' +
      '<input id="lStart" type="date">' +
      '<input id="lEnd" type="date">' +
      '</div>' +
      '<input id="lRem" placeholder="Remarks">' +
      '<button class="green" onclick="addLeave()">➕ Add Leave</button>' +
      '</div>';
  }

  html += '<div class="card"><h2>📋 Leave Records (' + leave.length + ')</h2>';
  if (!leave.length) {
    html += '<div style="text-align:center;color:#999;padding:20px">No records</div>';
  } else {
    leave.forEach(function(l) {
      var s = staff.find(function(x) { return x.id === l.staff_id; });
      html += '<div class="staff-row">' +
        '<div style="flex:1"><div style="font-weight:700">' + esc(s ? s.name : '?') + '</div>' +
        '<div style="font-size:11px;color:#888">' + l.type + ' · ' + fmtDate(l.start) + ' → ' + fmtDate(l.end) + '</div></div>' +
        '<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:#CAFFBF;color:#1E8449">' + l.status + '</span>';
      if (isSup) {
        html += '<button class="small red" onclick="delLeave(\'' + l.id + '\')">🗑</button>';
      }
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function addLeave() {
  var staff_id = document.getElementById('lStaff').value;
  var type = document.getElementById('lType').value;
  var start = document.getElementById('lStart').value;
  var end = document.getElementById('lEnd').value;
  var remarks = document.getElementById('lRem').value;
  if (!start || !end) { toast('Dates required', 'error'); return; }
  if (start > end) { toast('Start before end', 'error'); return; }
  var leave = get('leave', {});
  var id = 'l_' + uid();
  leave[id] = {
    id: id,
    staff_id: staff_id,
    type: type,
    start: start,
    end: end,
    status: 'Approved',
    remarks: remarks,
    at: new Date().toISOString()
  };
  save('leave', leave);
  logAudit('ADD_LEAVE', null, type);
  toast('Leave added ✅');
  render();
}

function delLeave(id) {
  if (!confirm('Delete?')) return;
  var leave = get('leave', {});
  delete leave[id];
  save('leave', leave);
  toast('Deleted');
  render();
}

function viewAudit() {
  if (App.user.role !== 'supervisor') {
    return '<div class="card" style="text-align:center;color:#999">Access denied</div>';
  }
  var log = Object.values(get('audit', {})).sort(function(a, b) {
    return new Date(b.at) - new Date(a.at);
  });

  var html = '<div class="card"><h2>📜 Audit Log (' + log.length + ')</h2>';
  if (!log.length) {
    html += '<div style="text-align:center;color:#999;padding:20px">No logs</div>';
  } else {
    log.slice(0, 100).forEach(function(l) {
      html += '<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px">' +
        '<div style="font-weight:700;color:#C8102E">' + esc(l.action) + '</div>' +
        '<div style="color:#666">👤 ' + esc(l.user) + '</div>' +
        '<div style="color:#999;font-size:10px">' + new Date(l.at).toLocaleString() + '</div>' +
        '</div>';
    });
  }
  html += '</div>';
  return html;
}

function viewSettings() {
  if (App.user.role !== 'supervisor') {
    return '<div class="card" style="text-align:center;color:#999">Access denied</div>';
  }
  var s = get('settings', {});
  return '<div class="card">' +
    '<h2>🏥 Hospital Settings</h2>' +
    '<input id="stHosp" placeholder="Hospital Name" value="' + esc(s.hospital_name || '') + '">' +
    '<input id="stDept" placeholder="Department" value="' + esc(s.department || '') + '">' +
    '<button class="green" onclick="saveSettings()">💾 Save</button>' +
    '</div>' +
    '<div class="card">' +
    '<h2>ℹ About</h2>' +
    '<div style="font-size:12px;color:#666">' +
    '<div><b>Phlebotomist Roster</b></div>' +
    '<div>Version 4.0</div>' +
    '<div>' + esc(s.hospital_name || '') + '</div>' +
    '</div></div>';
}

function saveSettings() {
  var s = get('settings', {});
  s.hospital_name = document.getElementById('stHosp').value;
  s.department = document.getElementById('stDept').value;
  save('settings', s);
  toast('Saved ✅');
  render();
}

function exportExcel() {
  var periods = get('periods', {});
  var p = periods[App.periodId];
  if (!p) { toast('No period', 'error'); return; }
  var staff = Object.values(get('staff', {})).filter(function(s) {
    return s.status === 'Active';
  });
  var dates = datesBetween(p.start, p.end);
  var asg = get('assignments', {});
  var pd = asg[p.id] || {};
  var settings = get('settings', {});

  var aoa = [];
  aoa.push([settings.hospital_name || 'Hospital']);
  aoa.push([(settings.department || '') + ' — Phlebotomist Duty Roster']);
  aoa.push([]);
  aoa.push(['Roster Period:', p.name, '', 'From:', p.start, 'To:', p.end]);
  aoa.push([]);

  var header = ['Sr.', 'Name', 'Mobile'];
  dates.forEach(function(d) { header.push(d.slice(8)); });
  header.push('M', 'E', 'E4', 'N12', 'D', 'X', 'OFF', 'CPL', 'TOTAL');
  aoa.push(header);

  staff.forEach(function(s, i) {
    var row = [i + 1, s.name, s.mobile || ''];
    var counts = { M: 0, E: 0, E4: 0, N12: 0, D: 0, X: 0, OFF: 0, CPL: 0 };
    dates.forEach(function(d) {
      var c = pd[s.id + '_' + d] || '';
      row.push(c);
      if (counts[c] !== undefined) counts[c]++;
    });
    var total = dates.filter(function(d) { return pd[s.id + '_' + d]; }).length;
    row.push(counts.M, counts.E, counts.E4, counts.N12, counts.D, counts.X, counts.OFF, counts.CPL, total);
    aoa.push(row);
  });

  aoa.push([]);
  aoa.push(['Generated:', new Date().toLocaleString('en-GB')]);
  aoa.push(['Prepared by:', App.user.name || App.user.username]);

  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Roster');
  XLSX.writeFile(wb, 'roster-' + p.name.replace(/\s+/g, '_') + '.xlsx');
  toast('Excel downloaded ✅');
}

function shareWhatsApp() {
  var periods = get('periods', {});
  var p = periods[App.periodId];
  if (!p) { toast('No period', 'error'); return; }
  var staff = Object.values(get('staff', {})).filter(function(s) {
    return s.status === 'Active';
  });
  var dates = datesBetween(p.start, p.end);
  var asg = get('assignments', {});
  var pd = asg[p.id] || {};
  var settings = get('settings', {});

  var text = '*' + (settings.hospital_name || 'Hospital') + '*\n';
  text += '*' + (settings.department || '') + '*\n';
  text += '*Roster:* ' + p.name + '\n\n';
  staff.forEach(function(s) {
    text += '*' + s.name + '*: ';
    var parts = [];
    dates.forEach(function(d) {
      parts.push(d.slice(8) + ':' + (pd[s.id + '_' + d] || '-'));
    });
    text += parts.join(' | ') + '\n\n';
  });

  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  toast('WhatsApp opening...');
}

initCache();

try {
  var saved = localStorage.getItem('phleb_user');
  if (saved) App.user = JSON.parse(saved);
} catch (e) {
  console.error('Session error', e);
}

setTimeout(function() {
  render();
}, 1200);
