<style>

.help{font-size:11px;color:#888;margin-top:-4px;margin-bottom:8px;font-style:italic}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;background:#E8EBF2;color:#666;padding:8px 14px;font-size:12px;border-radius:10px;font-weight:600}
.tabs button.active{background:#C8102E;color:#fff}
.divider{height:1px;background:#E8EBF2;margin:12px 0}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:#F0F2F5;color:#555;margin:2px}
.chip.blue{background:#E3F2FD;color:#1E5BA8}

.notif-badge{background:#C8102E;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px;font-weight:700}
.notif-item{padding:12px;border-bottom:1px solid #F0F2F5;cursor:pointer}
.notif-item.unread{background:#FFF9FA;border-left:3px solid #C8102E}
.notif-item .title{font-weight:700;font-size:13px;color:#C8102E;margin-bottom:3px}
.notif-item .desc{font-size:12px;color:#555;margin-bottom:4px}
.notif-item .time{font-size:10px;color:#AAA}
.staff-card{padding:12px;border-bottom:1px solid #F0F2F5;display:flex;align-items:center;gap:12px}
.staff-card .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#C8102E,#1E5BA8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.staff-card .info{flex:1;min-width:0}
.staff-card .name{font-weight:700;font-size:14px;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-card .detail{font-size:11px;color:#888}
.staff-card .actions{display:flex;gap:4px;flex-shrink:0}
.priority-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:#F9FAFB;padding:8px;border-radius:8px}
.priority-row .rank{font-size:18px;width:28px;text-align:center}
.priority-row select{flex:1;margin:0}
.priority-row button{width:36px;height:36px;padding:0;border-radius:8px;font-size:16px;flex-shrink:0}
.special-off-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;background:#FFF9FA;padding:8px;border-radius:8px;border-left:3px solid #C8102E}
.special-off-row input{flex:1;margin:0}
.special-off-row button{width:36px;height:36px;padding:0;border-radius:8px;flex-shrink:0}
.file-input{display:none}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.container{max-width:1200px;margin:0 auto}.nav{justify-content:center}}

<body>
<div id="app"></div>
<script>
/* ============================================================
   🔥 FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB4uyNiVe5CQ-vAZalcYpQxz2XCq4XY17o",
  authDomain: "phlebotomy-roster-f618f.firebaseapp.com",
  databaseURL: "https://phlebotomy-roster-f618f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "phlebotomy-roster-f618f",
  storageBucket: "phlebotomy-roster-f618f.firebasestorage.app",
  messagingSenderId: "433203658029",
  appId: "1:433203658029:web:bf2a31f75f4c3273df27a4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   📦 CACHE
   ============================================================ */
const Cache = {
  data: {},
  init() {
    const keys = ['users','staff','technologists','periods','assignments','leave','overtime','exchanges','audit','settings','notifications','chat','holidays','shifts','config'];
    keys.forEach(k => {
      db.ref(k).on('value', snap => {
        this.data[k] = snap.val();
        if (k === 'settings' && !this.data[k]) db.ref('settings').set(DEFAULT_SETTINGS);
        if (k === 'shifts' && !this.data[k]) db.ref('shifts').set(DEFAULT_SHIFTS);
        if (k === 'config' && !this.data[k]) db.ref('config').set(DEFAULT_CONFIG);
        if (k === 'users' && !this.data[k]) db.ref('users').set({
          admin:{username:'admin',password:'admin123',role:'supervisor',active:true,mobile:'03001234567',name:'Admin'}
        });
        if (S.user) render();
      });
    });
  },
  get(k, def) { return this.data[k] ?? def; },
  set(k, v) { this.data[k] = v; return db.ref(k).set(v); }
};

/* ============================================================
   📊 DEFAULT DATA
   ============================================================ */
const DEFAULT_SETTINGS = {
  hospital_name: 'KULSUM INTERNATIONAL HOSPITAL',
  department: 'Laboratory and Blood Bank',
  app_title: 'Phlebotomist Roster',
  whatsapp_bot: 'FlipBotMe',
  address: 'Islamabad, Pakistan'
};

const DEFAULT_CONFIG = {
  staff_12: { M: 3, E: 3, D: 1, N12: 1, E4: 1, X: 1, OFF: 2 },
  staff_11: { M: 3, E: 3, D: 1, N12: 1, E4: 1, OFF: 2 },
  staff_10: { M: 3, E: 3, D: 1, N12: 1, E4: 1, OFF: 1 },
  staff_9:  { M: 3, E: 3, D: 1, N12: 1, OFF: 1 },
  sunday:   { M: 2, E: 2, N: 1, OFF: 7 },
  cpl_per_hour: 0.125
};

const DEFAULT_SHIFTS = {
  M:   { code:'M',   name:'Morning',        start:'07:00', end:'15:30' },
  E:   { code:'E',   name:'Evening',        start:'15:00', end:'23:00' },
  E4:  { code:'E4',  name:'Evening4',       start:'16:00', end:'00:00' },
  N:   { code:'N',   name:'Night',          start:'23:00', end:'07:00' },
  N12: { code:'N12', name:'Night12',        start:'00:00', end:'08:00' },
  D:   { code:'D',   name:'Day (Gynee)',    start:'09:00', end:'21:00' },
  X:   { code:'X',   name:'Extra/Floating', start:'',      end:'' },
  OFF: { code:'OFF', name:'Weekly Off',     start:'',      end:'' },
  O:   { code:'O',   name:'OFF',            start:'',      end:'' },
  EL:  { code:'EL',  name:'Earned Leave',   start:'',      end:'' },
  CPL: { code:'CPL', name:'Comp. Leave',    start:'',      end:'' },
  CL:  { code:'CL',  name:'Casual Leave',   start:'',      end:'' },
  GH:  { code:'GH',  name:'Gazetted Holiday',start:'',     end:'' },
  SL:  { code:'SL',  name:'Sick Leave',     start:'',      end:'' },
  AL:  { code:'AL',  name:'Annual Leave',   start:'',      end:'' },
  ML:  { code:'ML',  name:'Maternity Leave',start:'',      end:'' }
};

/* ============================================================
   🎯 STATE
   ============================================================ */
const S = { user: null, view: 'dashboard', periodId: null, chatWith: null, chatType: 'group' };

/* ============================================================
   🛠 HELPERS
   ============================================================ */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,type='success'){const t=document.createElement('div');t.className='toast '+(type==='error'?'error':type==='info'?'info':type==='warning'?'warning':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),20);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2800);}
function datesBetween(s,e){const out=[];const d=new Date(s+'T00:00:00');const end=new Date(e+'T00:00:00');while(d<=end){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return out;}
function today(){return new Date().toISOString().slice(0,10);}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function fmtDate(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(d){return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function dayOfWeek(d){const dt=new Date(d+'T00:00:00');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];}
function isSunday(d){return new Date(d+'T00:00:00').getDay()===0;}
function isHoliday(d){const h=Cache.get('holidays',{})||{};return Object.values(h).some(x=>x.date===d&&x.active);}
function isSundayOrHoliday(d){return isSunday(d)||isHoliday(d);}
function getSetting(k){return (Cache.get('settings',{})||{})[k]||'';}
function initials(name){return (name||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function getWeekKey(d){const dt=new Date(d+'T00:00:00');const jan1=new Date(dt.getFullYear(),0,1);return dt.getFullYear()+'-W'+Math.ceil(((dt-jan1)/86400000+jan1.getDay()+1)/7);}

function audit(action, entity, oldv, newv, reason){
  const log = Cache.get('audit', {}) || {};
  const arr = Object.values(log);
  arr.unshift({id:uid(),user:S.user?S.user.username:'system',user_name:S.user?(S.user.name||S.user.username):'system',action,entity,old:oldv??null,new:newv??null,reason:reason||null,at:new Date().toISOString()});
  const obj = {}; arr.slice(0,1000).forEach(x => { obj[x.id] = x; });
  Cache.set('audit', obj);
}

function notifyAll(title, body, type='info'){
  const notifs = Cache.get('notifications', {}) || {};
  const id = 'n_' + uid();
  notifs[id] = { id, title, body, type, at:new Date().toISOString(), read:false };
  Cache.set('notifications', notifs);
}

/* ============================================================
   🔐 LOGIN
   ============================================================ */
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap"><div class="login">
      <div class="logo"><div class="logo-img">KIH</div></div>
      <h1>Phlebotomist Roster</h1>
      <p class="sub">KULSUM INTERNATIONAL HOSPITAL</p>
      <input id="u" placeholder="Mobile Number" inputmode="tel">
      <input id="p" type="password" placeholder="Password">
      <button onclick="doLogin()">🔐 Login</button>
      <div class="forgot"><a onclick="showForgot()">Forgot Password?</a></div>
      <div class="hint">Admin: admin / admin123</div>
    </div></div>`;
  document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

function doLogin(){
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if (!u || !p) return toast('Enter mobile and password','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => (x.username === u || x.mobile === u) && x.password === p);
  if (!user) return toast('Invalid credentials','error');
  if (user.active === false) return toast('Account disabled','error');
  S.user = { username:user.username, name:user.name||user.username, role:user.role, staff_id:user.staff_id||null, mobile:user.mobile||user.username };
  localStorage.setItem('phleb_user', JSON.stringify(S.user));
  S.view = 'dashboard';
  toast('Welcome ' + (user.name || user.username));
  render();
}

function doLogout(){ if(!confirm('Logout?')) return; S.user = null; localStorage.removeItem('phleb_user'); render(); }

function showForgot(){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>🔑 Forgot Password</h2>
    <p style="font-size:13px;color:#666;margin-bottom:12px">Enter your registered mobile number.</p>
    <input id="fgMobile" placeholder="Mobile Number" inputmode="tel">
    <div class="row"><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button><button onclick="sendOTP()">Send OTP</button></div>
    <div id="fgStatus" style="margin-top:12px;font-size:12px"></div>
  </div>`;
  document.body.appendChild(m);
}

function sendOTP(){
  const mobile = document.getElementById('fgMobile').value.trim();
  if (!mobile) return toast('Enter mobile','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => x.username === mobile || x.mobile === mobile);
  if (!user) { document.getElementById('fgStatus').innerHTML = '<span style="color:#C0392B">Mobile not registered</span>'; return; }
  const otp = Math.floor(100000 + Math.random() * 900000).toString();
  sessionStorage.setItem('otp_' + mobile, otp);
  document.getElementById('fgStatus').innerHTML = `
    <div style="background:#FFF3E0;padding:12px;border-radius:8px;color:#E67E22;font-weight:600">
      Demo OTP: <span style="font-size:20px;letter-spacing:3px">${otp}</span>
    </div>
    <input id="fgOTP" placeholder="Enter OTP" inputmode="numeric" maxlength="6" style="margin-top:12px">
    <input id="fgNewPass" type="password" placeholder="New Password (min 6 chars)">
    <button class="block success" onclick="verifyOTP('${mobile}')">Reset Password</button>`;
}

function verifyOTP(mobile){
  const entered = document.getElementById('fgOTP').value.trim();
  const newPass = document.getElementById('fgNewPass').value;
  const savedOTP = sessionStorage.getItem('otp_' + mobile);
  if (entered !== savedOTP) return toast('Invalid OTP','error');
  if (!newPass || newPass.length < 6) return toast('Password 6+ chars','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => x.username === mobile || x.mobile === mobile);
  user.password = newPass;
  Cache.set('users', users);
  audit('PASSWORD_RESET', 'user', null, mobile);
  sessionStorage.removeItem('otp_' + mobile);
  document.querySelector('.modal').remove();
  toast('Password reset! Login now.');
}

/* ============================================================

  const isSup = S.user.role === 'supervisor';

    ['dashboard','🏠','Home'],['roster','📅','Roster'],['staff','👥','Staff'],['technologist','🔬','Techno'],

/* ============================================================

   ============================================================ */
function viewDashboard(){
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s=>s.status==='Active');
  const periods = Object.values(Cache.get('periods',{})||{});
  const t = today();
  const cp = periods.find(p => p.start <= t && p.end >= t);
  const asg = Cache.get('assignments',{})||{};
  const lv = Object.values(Cache.get('leave',{})||{}).filter(l => l.start <= t && l.end >= t && l.status === 'Approved');
  const ex = Object.values(Cache.get('exchanges',{})||{}).filter(e => e.status === 'Pending');
  let td = {};
  if (cp) { const pd = asg[cp.id]||{}; staff.forEach(s => { const c = pd[s.id+'_'+t]; if (c) td[c] = (td[c]||0)+1; }); }
  const sundayHoliday = isSundayOrHoliday(t);
  return `
    <div class="stats">
      <div class="stat"><div class="num">${staff.length}</div><div class="label">Active Staff</div></div>
      <div class="stat green"><div class="num">${lv.length}</div><div class="label">On Leave</div></div>
      <div class="stat orange"><div class="num">${ex.length}</div><div class="label">Pending Exchange</div></div>
    </div>
    ${sundayHoliday?`<div class="card" style="background:linear-gradient(135deg,#FFF3E0,#FFE0B2)">
      <h2 style="color:#E67E22">🎉 ${isSunday(t)?'Sunday':'Gazetted Holiday'}</h2>
      <div style="font-size:13px;color:#7D4A00">Today: 2 M + 2 E + 1 N = 5 ON | First Floor + Basement only</div>
    </div>`:''}
    <div class="card">
      <h2>📅 Current Period</h2>
      ${cp?`<div style="font-weight:700;font-size:15px">${esc(cp.name)}</div>
      <div style="color:#666;font-size:12px;margin:4px 0">${fmtDate(cp.start)} → ${fmtDate(cp.end)}</div>
      <div>Status: <span class="badge b-${cp.status.toLowerCase()}">${cp.status}</span></div>`:'<div class="empty">No active period</div>'}
    </div>
    <div class="card">
      <h2>📊 Today's Duties</h2>
      ${Object.keys(td).length?`<div class="legend">${Object.entries(td).map(([c,n])=>`<span class="d-${c}">${c}: ${n}</span>`).join('')}</div>`:'<div class="empty"><div class="big">📋</div>No duties today</div>'}
    </div>`;
}

async function saveNewStaff(){
  const name = document.getElementById('nsName').value.trim();
  const gender = document.getElementById('nsGender').value;
  const mobile = document.getElementById('nsMobile').value.trim();
  const empId = document.getElementById('nsEmpId').value.trim();
  const desig = document.getElementById('nsDesig').value.trim();
  const contact = document.getElementById('nsContact').value.trim();
  const joinDate = document.getElementById('nsJoinDate').value;
  const password = document.getElementById('nsPassword').value || '123456';
  if (!name || !gender || !mobile || !empId || !desig) return toast('All mandatory fields required','error');
  if (window._shiftType === 'fixed' && !window._fixedShift) return toast('Select a fixed shift','error');
  if (window._shiftType === 'multi' && window._priorityShifts.filter(x=>x).length < 1) return toast('Add at least 1 shift','error');
  const staff = Cache.get('staff',{}) || {};
  if (Object.values(staff).find(s => s.mobile === mobile)) return toast('Mobile already registered','error');
  if (Object.values(staff).find(s => s.empId === empId)) return toast('Employee ID exists','error');
  const newId = 's_' + uid();
  staff[newId] = { id:newId, name, gender, mobile, empId, designation:desig, contact, joinDate,
    status:'Active', shiftType:window._shiftType,
    fixedShift: window._shiftType==='fixed'?window._fixedShift:null,
    priorityShifts: window._shiftType==='multi'?window._priorityShifts.filter(x=>x):[],
    specialOffs: window._specialOffs.filter(x=>x), cplBalance:0, createdAt:new Date().toISOString() };
  await Cache.set('staff', staff);
  const users = Cache.get('users',{}) || {};
  users[mobile] = { username:mobile, password, role:'staff', staff_id:newId, name, mobile, active:true };
  await Cache.set('users', users);
  audit('CREATE_STAFF', 'staff', null, name);
  notifyAll('New Staff Added', `${name} (${desig})`, 'staff');
  document.querySelector('.modal').remove();
  toast('Staff added ✅');
  render();
}

/* ============================================================
   📅 ROSTER
   ============================================================ */
function viewRoster(){
  const periods = Object.values(Cache.get('periods',{})||{}).sort((a,b)=>b.start.localeCompare(a.start));
  const isSup = S.user.role === 'supervisor';
  if (!periods.length){
    if (!isSup) return '<div class="card"><div class="empty">No roster</div></div>';
    return `<div class="card">
      <h2>📅 Create First Period</h2>
      <input id="pName" placeholder="Name" value="Sep 2026">
      <div class="grid2"><input id="pStart" type="date" value="2026-09-01"><input id="pEnd" type="date" value="2026-09-30"></div>
      <button class="block success" onclick="createPeriod()">Create</button>
    </div>`;
  }
  if (!S.periodId) S.periodId = periods[0].id;
  const period = periods.find(p => p.id === S.periodId) || periods[0];
  S.periodId = period.id;
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s=>s.status==='Active');
  const dates = datesBetween(period.start, period.end);
  const asg = Cache.get('assignments',{})||{};
  const pd = asg[period.id] || {};
  const locked = period.status === 'Locked';

  let grid = `<div class="scroll-x"><table><thead><tr><th>Name</th>${dates.map(d => `<th style="${isSundayOrHoliday(d)?'background:#E67E22':''}">${d.slice(8)}<br><span style="font-size:9px">${dayOfWeek(d)}</span></th>`).join('')}<th>O</th><th>CPL</th><th>Tot</th></tr></thead><tbody>`;
  staff.forEach(s => {
    const counts = { O:0, OFF:0, CPL:0 };
    grid += `<tr><td style="text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;${S.user.staff_id===s.id?'background:#FFF3E0;font-weight:700':''}">${esc(s.name)}</td>`;
    dates.forEach(d => {
      const code = pd[s.id+'_'+d] || '';
      if (counts[code] !== undefined) counts[code]++;
      const cls = code ? 'd-'+code : '';
      grid += `<td><span class="cell ${cls}" onclick="editCell('${s.id}','${d}')">${code||'·'}</span></td>`;
    });
    const tot = counts.O + counts.OFF + counts.CPL;
    grid += `<td>${counts.O+counts.OFF}</td><td>${counts.CPL}</td><td><b>${tot}</b></td></tr>`;
  });
  grid += '</tbody></table></div>';

  const opts = periods.map(p => `<option value="${p.id}" ${p.id===period.id?'selected':''}>${esc(p.name)}</option>`).join('');

  return `
    <div class="card">
      <div class="row"><select onchange="S.periodId=this.value;render()">${opts}</select><span class="badge b-${period.status.toLowerCase()}">${period.status}</span></div>
      <div style="color:#666;font-size:12px;margin-bottom:10px">${fmtDate(period.start)} → ${fmtDate(period.end)}</div>
      ${isSup?`<div class="grid2">
        <button class="success" onclick="autoGenerate()">⚡ Auto Generate</button>
        <button class="sec" onclick="publishRoster()">📢 Publish</button>
        ${locked?`<button class="warning" onclick="unlockRoster()">🔓 Unlock</button>`:`<button class="danger" onclick="lockRoster()">🔒 Lock</button>`}
        <button class="sec" onclick="exportExcel()">📊 Excel</button>
        <button class="sec" onclick="exportPDF()">📄 PDF</button>
        <button class="sec" onclick="newPeriodModal()">➕ New Period</button>
        <button class="sec" onclick="shareWhatsApp('full')">💬 WhatsApp</button>
      </div>`:`<div class="grid2"><button class="sec" onclick="shareWhatsApp('staff')">💬 Share</button></div>`}
    </div>
    <div class="card">
      <h2>📋 Roster Grid</h2>
      <div class="legend"><span class="d-M">M</span><span class="d-E">E</span><span class="d-E4">E4</span><span class="d-N12">N12</span><span class="d-D">D</span><span class="d-X">X</span><span class="d-OFF">OFF</span><span class="d-CPL">CPL</span></div>
      ${isSup?'<div class="help">Tap cell to change</div>':''}
      ${grid}
    </div>`;
}

async function createPeriod(){

function editCell(staffId, date){
  if (S.user.role !== 'supervisor') return toast('Only supervisor','error');
  const periods = Cache.get('periods',{}) || {};
  const period = periods[S.periodId];
  if (!period || period.status === 'Locked') return toast('Locked','error');
  const shifts = Cache.get('shifts',{}) || DEFAULT_SHIFTS;
  const asg = Cache.get('assignments',{}) || {};
  const pd = asg[period.id] || {};
  const cur = pd[staffId+'_'+date] || '';
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>Change Duty</h2>
    <div style="color:#666;font-size:12px;margin-bottom:10px">${fmtDate(date)} — Current: <b>${cur||'none'}</b></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${Object.values(shifts).map(d => `<button class="pill ${d.code===cur?'on':''}" onclick="setDuty('${staffId}','${date}','${d.code}')">${d.code}</button>`).join('')}
    </div>
    <div class="row"><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button></div>
  </div>`;
  document.body.appendChild(m);
}

async function setDuty(staffId, date, code){
  const asg = Cache.get('assignments',{}) || {};
  const pd = asg[S.periodId] || {};
  const old = pd[staffId+'_'+date] || null;
  if (old === code) { document.querySelector('.modal').remove(); return; }
  pd[staffId+'_'+date] = code;
  asg[S.periodId] = pd;
  await Cache.set('assignments', asg);
  audit('EDIT_DUTY', 'assignment', old, code);
  const staff = Cache.get('staff',{})[staffId];
  if (staff) notifyAll('Duty Changed', `${staff.name}'s ${fmtDate(date)} from ${old||'—'} to ${code}`, 'duty');
  document.querySelector('.modal').remove();
  toast('Updated');
  render();
}

async function publishRoster(){
  const periods = Cache.get('periods',{}) || {};
  const p = periods[S.periodId];
  if (!p) return;
  p.status = 'Published'; p.published = new Date().toISOString();
  await Cache.set('periods', periods);
  audit('PUBLISH', 'period', 'Draft', 'Published');
  notifyAll('Roster Published', `${p.name} is live`, 'roster');
  toast('Published');
  render();

        </div>`;

async function addOt(){
  const staff_id = document.getElementById('oStaff').value;
  const date = document.getElementById('oDate').value;
  const start = document.getElementById('oStart').value;
  const end = document.getElementById('oEnd').value;
  const reason = document.getElementById('oReason').value;
  if (!date || !start || !end) return toast('All required','error');
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if (mins < 0) mins += 24*60;
  const hours = +(mins/60).toFixed(2);
  const cpl = +(hours * 0.125).toFixed(3);
  const ot = Cache.get('overtime',{}) || {};
  const id = 'o_' + uid();
  ot[id] = { id, staff_id, date, start, end, hours, cpl, reason, by:S.user.name, at:new Date().toISOString() };
  await Cache.set('overtime', ot);
  const staff = Cache.get('staff',{}) || {};
  const s = staff[staff_id];
  if (s) { s.cplBalance = +((s.cplBalance||0) + cpl).toFixed(3); await Cache.set('staff', staff); }
  audit('ADD_OT', 'overtime', null, `${hours}h`);
  toast(`Added ${hours}h (+${cpl} CPL) ✅`);
  render();
}

      <div style="font-size:11px;margin:6px 0">

      </div>

      ${actions?`<div style="margin-top:8px;display:flex;gap:6px">${actions}</div>`:''}
    </div>`;
  };
  return `
    ${isStaff?`<div class="card">
      <h2>🔄 Request Exchange</h2>
      <select id="xTarget">${staff.filter(s=>s.id!==S.user.staff_id).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
      <input id="xDate" type="date">

      <button class="block success" onclick="addExchange()">📤 Submit</button>

    <div class="card"><h2>⏳ Pending (${pending.length})</h2>${pending.length?pending.map(renderEx).join(''):'<div class="empty">No pending</div>'}</div>
    <div class="card"><h2>✅ History (${completed.length})</h2>${completed.length?completed.slice(0,20).map(renderEx).join(''):'<div class="empty">No history</div>'}</div>`;

async function addExchange(){
  const target_id = document.getElementById('xTarget').value;

  const req = document.getElementById('xReq').value.toUpperCase().trim();
  const reason = document.getElementById('xReason').value.trim();
  if (!date || !orig || !req) return toast('All required','error');
  const ex = Cache.get('exchanges',{}) || {};

  await Cache.set('exchanges', ex);
  const staff = Cache.get('staff',{}) || {};
  const requester = staff[S.user.staff_id];
  const target = staff[target_id];

async function respondX(id, resp){
  const ex = Cache.get('exchanges',{}) || {};
  const e = ex[id];
  if (!e) return;
  e.staff_resp = resp;
  if (resp === 'Rejected') { e.status = 'Rejected'; e.sup_resp = 'Rejected'; }
  await Cache.set('exchanges', ex);
  toast(resp);
  render();
}
async function approveX(id, resp){
  const ex = Cache.get('exchanges',{}) || {};
  const e = ex[id];
  if (!e) return;
  e.sup_resp = resp;
  e.status = resp;
  if (resp === 'Approved') {
    const asg = Cache.get('assignments',{}) || {};
    const periods = Cache.get('periods',{}) || {};
    const p = Object.values(periods).find(pp => pp.start <= e.date && pp.end >= e.date);
    if (p && asg[p.id]) {
      const rk = e.requester_id + '_' + e.date;
      const tk = e.target_id + '_' + e.date;
      const rd = asg[p.id][rk] || e.orig;
      const td = asg[p.id][tk] || e.req;
      asg[p.id][rk] = td; asg[p.id][tk] = rd;
      await Cache.set('assignments', asg);
    }
  }
  await Cache.set('exchanges', ex);
  const staff = Cache.get('staff',{}) || {};
  const r = staff[e.requester_id];
  const t = staff[e.target_id];
  notifyAll('Exchange ' + resp, `${r?r.name:'Staff'} ↔ ${t?t.name:'Staff'}`, 'exchange');
  toast(resp);
  render();
}

function exportExcel(){

  const aoa = [];
  // Row 1: Hospital name
  aoa.push([settings.hospital_name]);
  // Row 2: Department
  aoa.push([settings.department + ' — Phlebotomist Duty Roster']);
  // Row 3: blank
  aoa.push([]);
  // Row 4: Period info
  aoa.push(['Roster Period:', p.name, '', 'From:', p.start, 'To:', p.end]);
  // Row 5: blank
  aoa.push([]);
  // Row 6: Header
  const headerRow = ['Sr.', 'Name', 'Mobile'];
  dates.forEach(d => headerRow.push(d.slice(8)));
  headerRow.push('M', 'E', 'E4', 'N12', 'D', 'X', 'OFF', 'CPL', 'TOTAL');
  aoa.push(headerRow);

  // Staff rows
  staff.forEach((s, i) => {
    const row = [i + 1, s.name, s.mobile || ''];
    const counts = { M:0, E:0, E4:0, N12:0, D:0, X:0, OFF:0, CPL:0 };
    dates.forEach(d => {
      const c = pd[s.id + '_' + d] || '';
      row.push(c);
      if (counts[c] !== undefined) counts[c]++;
    });
    const total = dates.filter(d => pd[s.id + '_' + d]).length;
    row.push(counts.M, counts.E, counts.E4, counts.N12, counts.D, counts.X, counts.OFF, counts.CPL, total);
    aoa.push(row);
  });

  // Footer
  aoa.push([]);
  aoa.push(['Generated:', new Date().toLocaleString('en-GB')]);
  aoa.push(['Prepared by:', S.user.name || S.user.username]);
  aoa.push(['Approved by:', '____________________']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [

  ];
  ws['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 8 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 8 } }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Roster');
  XLSX.writeFile(wb, 'roster-' + p.name.replace(/\s+/g,'_') + '.xlsx');
  audit('EXPORT_EXCEL', 'period', null, p.name);
  toast('Excel downloaded ✅');
}

  doc.line(40, 100, doc.internal.pageSize.width - 40, 100);

      if (c === 'O' || c === 'OFF') o++;
      else if (c === 'CPL') cpl++;
      if (c) tot++;
    });
    row.push(o, cpl, tot);
    return row;
  });

  doc.autoTable({
    head, body, startY: 115,

    columnStyles: { 0: { halign: 'left', cellWidth: 95, fontStyle: 'bold' } },

  });

  doc.text(settings.hospital_name + ' | ' + (settings.address || ''), 40, fy + 20);

  doc.save('roster-' + p.name.replace(/\s+/g,'_') + '.pdf');
  audit('EXPORT_PDF', 'period', null, p.name);
  toast('PDF downloaded ✅');
}

   ============================================================ */
function viewReports(){
  const periods = Object.values(Cache.get('periods',{})||{});
  const staff = Object.values(Cache.get('staff',{})||{});
  const asg = Cache.get('assignments',{})||{};
  const leave = Object.values(Cache.get('leave',{})||{});
  const ot = Object.values(Cache.get('overtime',{})||{});
  const ex = Object.values(Cache.get('exchanges',{})||{});
  const pid = S.periodId || (periods[0]?.id);
  const p = periods.find(x => x.id === pid);
  const pd = asg[pid] || {};

  let rows = [];
  if (p) {
    const dates = datesBetween(p.start, p.end);
    staff.filter(s => s.status === 'Active').forEach(s => {
      const c = { M:0, E:0, N:0, D:0, X:0, OFF:0, CPL:0, EL:0, total:0 };
      dates.forEach(d => {
        const code = pd[s.id+'_'+d] || '';
        if (code === 'M') c.M++;
        else if (code === 'E') c.E++;
        else if (['N','N12'].includes(code)) c.N++;
        else if (code === 'D') c.D++;
        else if (code === 'X') c.X++;
        else if (code === 'O' || code === 'OFF') c.OFF++;
        else if (code === 'CPL') c.CPL++;
        else if (code === 'EL') c.EL++;
        if (code) c.total++;
      });
      rows.push({ name: s.name, cplBalance: s.cplBalance || 0, ...c });
    });
  }

  const totalOT = ot.reduce((sum, o) => sum + (o.hours || 0), 0);
  const totalOTcpl = ot.reduce((sum, o) => sum + (o.cpl || 0), 0);

  return `
    <div class="card">
      <h2>📊 Monthly Summary</h2>
      ${p?`<div style="font-size:12px;color:#666;margin-bottom:8px">${esc(p.name)}</div>`:''}
      <div class="scroll-x">
        <table>
          <thead><tr><th>Staff</th><th>M</th><th>E</th><th>N</th><th>D</th><th>X</th><th>OFF</th><th>CPL</th><th>EL</th><th>Tot</th><th>CPL Bal</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td style="text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</td>
            <td>${r.M}</td><td>${r.E}</td><td>${r.N}</td><td>${r.D}</td><td>${r.X}</td>
            <td>${r.OFF}</td><td>${r.CPL}</td><td>${r.EL}</td><td><b>${r.total}</b></td>
            <td><b style="color:${r.cplBalance>0?'#27AE60':'#666'}">${r.cplBalance.toFixed(2)}</b></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>⏱ Overtime Summary</h2>
      <div class="stats" style="grid-template-columns:1fr 1fr">
        <div class="stat green"><div class="num">${totalOT.toFixed(1)}h</div><div class="label">OT Hours</div></div>
        <div class="stat orange"><div class="num">${totalOTcpl.toFixed(2)}</div><div class="label">CPL Earned</div></div>
      </div>
    </div>
    <div class="card">
      <h2>🏖 Leave Report</h2>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Staff</th><th>Type</th><th>Start</th><th>End</th><th>Days</th></tr></thead>
          <tbody>${leave.slice(0,30).map(l => {
            const s = staff.find(x => x.id === l.staff_id);
            const days = Math.ceil((new Date(l.end)-new Date(l.start))/86400000)+1;
            return `<tr><td>${esc(s?s.name:'?')}</td><td><span class="chip">${l.type}</span></td><td>${fmtDate(l.start)}</td><td>${fmtDate(l.end)}</td><td><b>${days}</b></td></tr>`;
          }).join('') || '<tr><td colspan="5">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>🔄 Exchange Report</h2>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Requester</th><th>Target</th><th>Date</th><th>Status</th></tr></thead>
          <tbody>${ex.slice(0,30).map(e => {
            const r = staff.find(x => x.id === e.requester_id);
            const t = staff.find(x => x.id === e.target_id);
            return `<tr><td>${esc(r?r.name:'?')}</td><td>${esc(t?t.name:'?')}</td><td>${fmtDate(e.date)}</td><td><span class="badge b-${e.status.toLowerCase()}">${e.status}</span></td></tr>`;
          }).join('') || '<tr><td colspan="4">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>
    ${S.user.role === 'supervisor'?`<div class="card">
      <h2>📤 Export Reports</h2>
      <div class="grid2">
        <button onclick="exportExcel()">📊 Excel</button>
        <button class="blue" onclick="exportPDF()">📄 PDF</button>
      </div>
    </div>`:''}`;
}

/* ============================================================
   🔬 TECHNOLOGIST (الگ tab)
   ============================================================ */
function viewTechnologist(){
  const isSup = S.user.role === 'supervisor';
  const techs = Object.values(Cache.get('technologists',{})||{});
  return `
    <div class="card">
      <h2>🔬 Technologist Roster</h2>
      <div class="help">Separate roster for Lab Technologists</div>
      ${isSup?`<button class="block success" onclick="showAddTechnologist()">➕ Add Technologist</button>`:''}
      <div class="divider"></div>
      ${techs.length?techs.map(t => `<div class="staff-card">
        <div class="avatar">${initials(t.name)}</div>
        <div class="info">
          <div class="name">${esc(t.name)}</div>
          <div class="detail">${esc(t.designation||'Technologist')} · 📱 ${esc(t.mobile||'')}</div>
        </div>
      </div>`).join(''):'<div class="empty"><div class="big">🔬</div>No technologists added yet</div>'}
    </div>`;
}
function showAddTechnologist(){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>➕ Add Technologist</h2>
    <input id="tName" placeholder="Name *">
    <input id="tMobile" placeholder="Mobile *" inputmode="tel">
    <input id="tDesig" placeholder="Designation" value="Lab Technologist">
    <div class="row"><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button><button class="success" onclick="saveTechnologist()">Save</button></div>
  </div>`;
  document.body.appendChild(m);
}
async function saveTechnologist(){
  const name = document.getElementById('tName').value.trim();
  const mobile = document.getElementById('tMobile').value.trim();
  const desig = document.getElementById('tDesig').value.trim();
  if (!name || !mobile) return toast('Name and mobile required','error');
  const techs = Cache.get('technologists',{}) || {};
  const id = 't_' + uid();
  techs[id] = { id, name, mobile, designation:desig, status:'Active' };
  await Cache.set('technologists', techs);
  toast('Technologist added ✅');
  document.querySelector('.modal').remove();
  render();
}

/* ============================================================
   📜 AUDIT LOG
   ============================================================ */
function viewAudit(){
  if (S.user.role !== 'supervisor') return '<div class="card"><div class="empty">Access denied</div></div>';
  const log = Object.values(Cache.get('audit',{})||{}).sort((a,b)=>new Date(b.at)-new Date(a.at));
  return `
    <div class="card">
      <h2>📜 Audit Log (${log.length})</h2>
      <input id="auditSearch" placeholder="🔍 Search..." oninput="filterAudit()">
      <div style="max-height:70vh;overflow-y:auto" id="auditList">
        ${log.slice(0,100).map(l => `<div class="notif-item" data-search="${esc((l.action+' '+l.user_name+(l.new||'')).toLowerCase())}">
          <div class="title">${esc(l.action)}</div>
          <div class="desc">👤 ${esc(l.user_name||l.user)}${l.old||l.new?` · <span style="color:#888">${esc(l.old||'—')} → ${esc(l.new||'—')}</span>`:''}</div>
          <div class="time">${fmtTime(l.at)}</div>
        </div>`).join('')}
      </div>
      <button class="sec block" style="margin-top:10px" onclick="clearAudit()">🗑 Clear Old Logs</button>
    </div>`;
}
function filterAudit(){
  const q = document.getElementById('auditSearch').value.toLowerCase();
  document.querySelectorAll('#auditList .notif-item').forEach(el => {
    el.style.display = el.dataset.search.includes(q) ? 'block' : 'none';
  });
}
async function clearAudit(){
  if (!confirm('Clear logs older than 30 days?')) return;
  const log = Cache.get('audit',{}) || {};
  const cutoff = Date.now() - 30*24*60*60*1000;
  const filtered = {};
  Object.values(log).forEach(l => { if (new Date(l.at).getTime() > cutoff) filtered[l.id] = l; });
  await Cache.set('audit', filtered);
  toast('Old logs cleared');
  render();
}

/* ============================================================
   ⚙ SETTINGS
   ============================================================ */
function viewSettings(){
  if (S.user.role !== 'supervisor') return '<div class="card"><div class="empty">Access denied</div></div>';
  const s = Cache.get('settings',{}) || {};
  const holidays = Object.values(Cache.get('holidays',{})||{});
  const shifts = Cache.get('shifts',{}) || DEFAULT_SHIFTS;
  return `
    <div class="card">
      <h2>🏥 Hospital Settings</h2>
      <input id="stHosp" placeholder="Hospital Name" value="${esc(s.hospital_name||'')}">
      <input id="stDept" placeholder="Department" value="${esc(s.department||'')}">
      <input id="stAddr" placeholder="Address" value="${esc(s.address||'')}">
      <input id="stWa" placeholder="WhatsApp Bot" value="${esc(s.whatsapp_bot||'')}">
      <button class="block success" onclick="saveSettings()">💾 Save</button>
    </div>
    <div class="card">
      <h2>🎉 Gazetted Holidays</h2>
      <div class="help">Roster will apply Sunday rules on these dates</div>
      ${holidays.length?holidays.map(h => `<div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee">
        <div style="flex:1"><b>${esc(h.name)}</b><div style="font-size:11px;color:#888">${fmtDate(h.date)}</div></div>
        <button class="danger sm" onclick="delHoliday('${h.id}')">🗑</button>
      </div>`).join(''):'<div class="empty">No holidays added</div>'}
      <button class="sec block" onclick="showAddHoliday()">➕ Add Holiday</button>
    </div>
    <div class="card">
      <h2>⏰ Shift Timings</h2>
      ${Object.values(shifts).slice(0,9).map(sh => `<div style="padding:8px;border-bottom:1px solid #eee;font-size:12px">
        <b>${sh.code}</b> — ${sh.name} <span style="color:#888">${sh.start||''}${sh.end?' - '+sh.end:''}</span>
      </div>`).join('')}
    </div>
    <div class="card">
      <h2>💾 Data Backup</h2>
      <button class="sec block" style="margin-bottom:8px" onclick="exportAllData()">📤 Export Backup (JSON)</button>
      <button class="sec block" onclick="importAllData()">📥 Import Backup</button>
      <div class="help" style="margin-top:8px">Firebase auto-backup is always active.</div>
    </div>
    <div class="card">
      <h2>ℹ About</h2>
      <div style="font-size:12px;color:#666;line-height:1.7">
        <b>${esc(s.app_title||'Phlebotomist Roster')}</b><br>
        Version 3.0<br>
        ${esc(s.hospital_name||'')}<br>
        Data synced via Firebase
      </div>
    </div>`;
}
async function saveSettings(){
  const s = Cache.get('settings',{}) || {};
  s.hospital_name = document.getElementById('stHosp').value;
  s.department = document.getElementById('stDept').value;
  s.address = document.getElementById('stAddr').value;
  s.whatsapp_bot = document.getElementById('stWa').value;
  await Cache.set('settings', s);
  audit('EDIT_SETTINGS', 'settings', null, s.hospital_name);
  toast('Saved ✅');
  render();
}
function showAddHoliday(){
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>➕ Add Holiday</h2>
    <input id="hName" placeholder="Holiday Name">
    <input id="hDate" type="date">
    <div class="row"><button class="sec" onclick="this.closest('.modal').remove()">Cancel</button><button class="success" onclick="saveHoliday()">Save</button></div>
  </div>`;
  document.body.appendChild(m);
}
async function saveHoliday(){
  const name = document.getElementById('hName').value.trim();
  const date = document.getElementById('hDate').value;
  if (!name || !date) return toast('All required','error');
  const holidays = Cache.get('holidays',{}) || {};
  const id = 'h_' + uid();
  holidays[id] = { id, name, date, active: true };
  await Cache.set('holidays', holidays);
  audit('ADD_HOLIDAY', 'holiday', null, `${name} (${date})`);
  document.querySelector('.modal').remove();
  toast('Holiday added ✅');
  render();
}
async function delHoliday(id){
  if (!confirm('Delete?')) return;
  const holidays = Cache.get('holidays',{}) || {};
  delete holidays[id];
  await Cache.set('holidays', holidays);
  render();
}
async function exportAllData(){
  const data = {};
  ['users','staff','technologists','periods','assignments','leave','overtime','exchanges','audit','settings','notifications','holidays','shifts','config'].forEach(k => data[k] = Cache.get(k));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'phleb-backup-' + today() + '.json'; a.click();
  toast('Downloaded ✅');
}
function importAllData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!confirm('Replace all current data?')) return;
    const r = new FileReader();
    r.onload = async (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        for (const k of Object.keys(data)) { if (data[k]) await Cache.set(k, data[k]); }
        toast('Restored ✅');
        setTimeout(() => render(), 500);
      } catch (err) { toast('Invalid file','error'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   🚀 BOOT
   ============================================================ */
Cache.init();

try {
  const saved = localStorage.getItem('phleb_user');
  if (saved) S.user = JSON.parse(saved);
} catch {}

setTimeout(() => {
  render();
  setInterval(() => { if (S.user) render(); }, 15000);
}, 1200);

</script>
</body>
