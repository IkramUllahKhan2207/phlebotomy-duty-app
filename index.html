  set(k, v) {

    return db.ref(k).set(v).catch(e => { toast('Sync error','error'); throw e; });
  },
  update(k, v) {

    return db.ref(k).set(v);

};

/* ============================================================
   🛠 HELPERS

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,type='success'){
  const t=document.createElement('div');
  t.className='toast '+(type==='error'?'error':type==='info'?'info':type==='warning'?'warning':'');
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),20);
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2800);
}
function datesBetween(s,e){const out=[];const d=new Date(s+'T00:00:00');const end=new Date(e+'T00:00:00');while(d<=end){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1);}return out;}
function today(){return new Date().toISOString().slice(0,10);}
function uid(){return Date.now()+Math.floor(Math.random()*1000);}
function fmtDate(d){const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTime(d){return new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function dayOfWeek(d){const dt=new Date(d+'T00:00:00');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];}
function isSunday(d){return new Date(d+'T00:00:00').getDay()===0;}
function isHoliday(d){const h=Cache.get('holidays',{})||{};return Object.values(h).some(x=>x.date===d&&x.active);}
function isSundayOrHoliday(d){return isSunday(d)||isHoliday(d);}
function getSetting(k){return (Cache.get('settings',{})||{})[k]||'';}
function initials(name){return (name||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}

function audit(action, entity, oldv, newv, reason) {
  const log = Cache.get('audit', {}) || {};
  const arr = Object.values(log);
  const entry = {
    id: uid(),
    user: S.user ? S.user.username : 'system',
    user_name: S.user ? (S.user.name || S.user.username) : 'system',
    action, entity,
    old: oldv ?? null, new: newv ?? null,
    reason: reason || null,
    at: new Date().toISOString()
  };
  arr.unshift(entry);
  const obj = {};
  arr.slice(0, 1000).forEach(x => { obj[x.id] = x; });
  Cache.set('audit', obj);
}

function notifyAll(title, body, type='info') {
  const notifs = Cache.get('notifications', {}) || {};
  const id = 'n_' + uid();
  notifs[id] = { id, title, body, type, at:new Date().toISOString(), read:false };
  Cache.set('notifications', notifs);
}

        <input id="p" type="password" placeholder="Password" autocomplete="current-password">
        <button onclick="doLogin()">🔐 Login</button>
        <div class="forgot"><a onclick="showForgot()">Forgot Password?</a></div>
        <div class="hint">Admin: 03001234567 / admin123</div>
      </div>
    </div>`;
  document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('u').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('p').focus(); });
}

function doLogin() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if (!u || !p) return toast('Enter mobile and password','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => 
    x.username === u && x.password === p
  );
  if (!user) return toast('Invalid credentials','error');
  if (user.active === false) return toast('Account disabled','error');
  S.user = { 
    username: user.username, 
    name: user.name || user.username,
    role: user.role, 
    staff_id: user.staff_id || null,
    mobile: user.mobile || user.username
  };
  localStorage.setItem('phleb_user', JSON.stringify(S.user));
  S.view = 'dashboard';
  toast('Welcome ' + (user.name || user.username));
  render();
}

function doLogout() {
  if (!confirm('Logout?')) return;
  S.user = null;
  localStorage.removeItem('phleb_user');
  render();
}

function showForgot() {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>🔑 Forgot Password</h2>
    <p style="font-size:13px;color:#666;margin-bottom:12px">Enter your registered mobile number. We'll send you an OTP.</p>
    <input id="fgMobile" placeholder="Mobile Number" inputmode="tel">
    <div class="row">
      <button class="sec" onclick="this.closest('.modal').remove()">Cancel</button>
      <button onclick="sendOTP()">Send OTP</button>
    </div>
    <div id="fgStatus" style="margin-top:12px;font-size:12px"></div>
  </div>`;
  document.body.appendChild(m);
}

function sendOTP() {
  const mobile = document.getElementById('fgMobile').value.trim();
  if (!mobile) return toast('Enter mobile','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => x.username === mobile);
  if (!user) {
    document.getElementById('fgStatus').innerHTML = '<span style="color:#C0392B">Mobile not registered</span>';
    return;
  }
  // Demo: Generate 6-digit OTP
  const otp = Math.floor(100000 + Math.random() * 900000).toString();
  sessionStorage.setItem('otp_' + mobile, otp);
  sessionStorage.setItem('otp_time_' + mobile, Date.now().toString());
  document.getElementById('fgStatus').innerHTML = `
    <div style="background:#FFF3E0;padding:12px;border-radius:8px;color:#E67E22;font-weight:600">
      Demo OTP: <span style="font-size:20px;letter-spacing:3px">${otp}</span>
      <div style="font-size:11px;margin-top:6px;color:#666">(In production, this will be sent via SMS)</div>
    </div>
    <input id="fgOTP" placeholder="Enter 6-digit OTP" inputmode="numeric" maxlength="6" style="margin-top:12px">
    <input id="fgNewPass" type="password" placeholder="New Password (min 6 chars)">
    <button class="block success" onclick="verifyOTPReset('${mobile}')">Reset Password</button>
  `;
}

function verifyOTPReset(mobile) {
  const entered = document.getElementById('fgOTP').value.trim();
  const newPass = document.getElementById('fgNewPass').value;
  const savedOTP = sessionStorage.getItem('otp_' + mobile);
  const savedTime = parseInt(sessionStorage.getItem('otp_time_' + mobile) || '0');
  if (Date.now() - savedTime > 5*60*1000) return toast('OTP expired','error');
  if (entered !== savedOTP) return toast('Invalid OTP','error');
  if (!newPass || newPass.length < 6) return toast('Password must be 6+ chars','error');
  const users = Cache.get('users', {}) || {};
  const user = Object.values(users).find(x => x.username === mobile);
  if (!user) return toast('User not found','error');
  user.password = newPass;
  Cache.set('users', users);
  audit('PASSWORD_RESET', 'user', null, mobile);
  sessionStorage.removeItem('otp_' + mobile);
  document.querySelector('.modal').remove();
  toast('Password reset! Login now.');
}

function viewDashboard() {
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s=>s.status==='Active');
  const periods = Object.values(Cache.get('periods',{})||{});
  const t = today();
  const cp = periods.find(p => p.start <= t && p.end >= t);
  const asg = Cache.get('assignments',{})||{};
  const lv = Object.values(Cache.get('leave',{})||{}).filter(l => l.start <= t && l.end >= t && l.status === 'Approved');
  const ex = Object.values(Cache.get('exchanges',{})||{}).filter(e => e.status === 'Pending');
  const ot = Object.values(Cache.get('overtime',{})||{});
  const todayHoliday = isHoliday(t);
  const todaySunday = isSunday(t);

  let td = {};
  if (cp) {
    const pd = asg[cp.id] || {};
    staff.forEach(s => {
      const c = pd[s.id + '_' + t];
      if (c) td[c] = (td[c]||0) + 1;
    });
  }

  return `
    <div class="stats">
      <div class="stat"><div class="num">${staff.length}</div><div class="label">Active Staff</div></div>
      <div class="stat green"><div class="num">${lv.length}</div><div class="label">On Leave</div></div>

      <div class="stat blue"><div class="num">${ot.length}</div><div class="label">Overtime</div></div>
    </div>
    ${(todaySunday||todayHoliday)?`<div class="card" style="background:linear-gradient(135deg,#FFF3E0,#FFE0B2)">
      <h2 style="color:#E67E22">🎉 ${todaySunday?'Sunday':'Gazetted Holiday'}</h2>
      <div style="font-size:13px;color:#7D4A00">Today is ${todaySunday?'Sunday':'Holiday'} — Special Sunday roster applies (2 M + 2 E + 1 N)</div>
    </div>`:''}
    <div class="card">
      <h2><span class="ico">📅</span> Current Period</h2>
      ${cp ? `
        <div style="font-weight:700;font-size:15px">${esc(cp.name)}</div>
        <div style="color:#666;font-size:12px;margin:4px 0">${fmtDate(cp.start)} → ${fmtDate(cp.end)}</div>
        <div style="margin-top:8px">Status: <span class="badge b-${cp.status.toLowerCase()}">${cp.status}</span></div>
      ` : '<div class="empty">No active period</div>'}
    </div>
    <div class="card">
      <h2><span class="ico">📊</span> Today's Duties (${fmtDate(t)})</h2>
      ${Object.keys(td).length ? `
        <div class="legend">${Object.entries(td).map(([c,n])=>`<span class="d-${c}">${c}: ${n}</span>`).join('')}</div>
      ` : '<div class="empty"><div class="big">📋</div>No duties today</div>'}
    </div>
    <div class="card">
      <h2><span class="ico">⚡</span> Quick Actions</h2>
      <div class="grid2">
        <button onclick="go('roster')">📅 View Roster</button>
        <button class="blue" onclick="go('staff')">👥 Staff</button>
        <button class="sec" onclick="go('notifications')">🔔 Notifications</button>
        <button class="sec" onclick="go('chat')">💬 Chat</button>
      </div>
    </div>`;
}

async function saveNewStaff() {
  const name = document.getElementById('nsName').value.trim();
  const gender = document.getElementById('nsGender').value;
  const mobile = document.getElementById('nsMobile').value.trim();
  const empId = document.getElementById('nsEmpId').value.trim();
  const desig = document.getElementById('nsDesig').value.trim();
  const contact = document.getElementById('nsContact').value.trim();
  const joinDate = document.getElementById('nsJoinDate').value;
  const password = document.getElementById('nsPassword').value || '123456';

  if (!name || !gender || !mobile || !empId || !desig) {
    return toast('All mandatory fields required','error');
  }
  if (window._shiftType === 'fixed' && !window._fixedShift) {
    return toast('Select a fixed shift','error');
  }
  if (window._shiftType === 'multi') {
    const valid = window._priorityShifts.filter(x => x);
    if (valid.length < 1) return toast('Add at least 1 shift','error');
  }

  const staff = Cache.get('staff', {}) || {};
  if (Object.values(staff).find(s => s.mobile === mobile)) {
    return toast('Mobile already registered','error');
  }
  if (Object.values(staff).find(s => s.empId === empId)) {
    return toast('Employee ID already exists','error');
  }

  const newId = 's_' + uid();
  staff[newId] = {
    id: newId,
    name, gender, mobile,
    empId, designation: desig, contact, joinDate,
    status: 'Active',
    shiftType: window._shiftType,
    fixedShift: window._shiftType === 'fixed' ? window._fixedShift : null,
    priorityShifts: window._shiftType === 'multi' ? window._priorityShifts.filter(x=>x) : [],
    specialOffs: window._specialOffs.filter(x => x),
    cplBalance: 0,
    createdAt: new Date().toISOString()
  };
  await Cache.set('staff', staff);

  const users = Cache.get('users', {}) || {};
  users[mobile] = {
    username: mobile, password,
    role: 'staff', staff_id: newId,
    name, mobile, active: true
  };
  await Cache.set('users', users);

  audit('CREATE_STAFF', 'staff', null, name);
  notifyAll('New Staff Added', `${name} (${desig}) added to team`, 'staff');
  document.querySelector('.modal').remove();
  toast('Staff added ✅');
  render();
}

function viewRoster() {
  const periodsObj = Cache.get('periods',{}) || {};
  const periods = Object.values(periodsObj).sort((a,b)=>b.start.localeCompare(a.start));
  const isSup = S.user.role === 'supervisor';

  if (!periods.length) {
    if (!isSup) return '<div class="card"><div class="empty">No roster published</div></div>';
    return `<div class="card">
      <h2><span class="ico">📅</span> Create First Roster Period</h2>
      <input id="pName" placeholder="Name" value="Aug-Sep 2026">
      <div class="grid2">
        <input id="pStart" type="date" value="2026-08-26">
        <input id="pEnd" type="date" value="2026-09-25">
      </div>
      <button class="block success" onclick="createPeriod()">Create Period</button>
    </div>`;
  }

  if (!S.periodId) S.periodId = periods[0].id;
  const period = periods.find(p => p.id === S.periodId) || periods[0];
  S.periodId = period.id;

  const staff = Object.values(Cache.get('staff',{})||{}).filter(s=>s.status==='Active');
  const dates = datesBetween(period.start, period.end);
  const asg = Cache.get('assignments',{}) || {};
  const pd = asg[period.id] || {};
  const locked = period.status === 'Locked';

  let grid = `<div class="scroll-x"><table><thead><tr><th>Name</th>${dates.map(d => 
    `<th style="${isSundayOrHoliday(d)?'background:#E67E22':''}">${d.slice(8)}<br><span style="font-size:9px;opacity:.8">${dayOfWeek(d)}</span></th>`
  ).join('')}<th>O</th><th>CPL</th><th>EL</th><th>Tot</th></tr></thead><tbody>`;

  staff.forEach(s => {
    const counts = { O:0, CPL:0, EL:0 };
    grid += `<tr><td style="text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;${S.user.staff_id===s.id?'background:#FFF3E0;font-weight:700':''}">${esc(s.name)}</td>`;
    dates.forEach(d => {
      const code = pd[s.id + '_' + d] || '';
      if (counts[code] !== undefined) counts[code]++;
      const cls = code ? 'd-' + code : '';
      grid += `<td><span class="cell ${cls}" onclick="editCell('${s.id}','${d}')">${code || '·'}</span></td>`;
    });
    const tot = counts.O + counts.CPL + counts.EL;
    grid += `<td>${counts.O}</td><td>${counts.CPL}</td><td>${counts.EL}</td><td><b>${tot}</b></td></tr>`;
  });
  grid += '</tbody></table></div>';

  const opts = periods.map(p => `<option value="${p.id}" ${p.id===period.id?'selected':''}>${esc(p.name)}</option>`).join('');

  return `
    <div class="card">
      <div class="row">
        <select onchange="S.periodId=this.value;render()">${opts}</select>
        <span class="badge b-${period.status.toLowerCase()}">${period.status}</span>
      </div>
      <div style="color:#666;font-size:12px;margin-bottom:10px">${fmtDate(period.start)} → ${fmtDate(period.end)}</div>
      ${isSup ? `
        <div class="grid2">
          <button class="success" onclick="autoGenerate()">⚡ Auto Generate</button>
          <button class="sec" onclick="showImportDialog()">📥 Import Excel</button>
          <button class="sec" onclick="publishRoster()">📢 Publish</button>
          ${locked 
            ? `<button class="warning" onclick="unlockRoster()">🔓 Unlock</button>`
            : `<button class="danger" onclick="lockRoster()">🔒 Lock</button>`}
          <button class="sec" onclick="exportExcel()">📊 Excel</button>
          <button class="sec" onclick="exportPDF()">📄 PDF</button>
          <button class="sec" onclick="newPeriodModal()">➕ New Period</button>
          <button class="sec" onclick="shareWhatsApp('full')">💬 WhatsApp</button>
        </div>
      ` : `
        <div class="grid2">
          <button class="sec" onclick="shareWhatsApp('staff')">💬 Share My Duties</button>
          <button onclick="go('exchange')">🔄 Exchange</button>
        </div>
      `}
    </div>
    <div class="card">
      <h2><span class="ico">📋</span> Roster Grid</h2>
      <div class="legend">
        <span class="d-M">M</span><span class="d-E">E</span>
        <span class="d-N12">N12</span><span class="d-D">D</span>
        <span class="d-X">X</span><span class="d-O">O</span>
        <span class="d-CPL">CPL</span><span class="d-EL">EL</span>
      </div>
      ${isSup?'<div class="help">Tap cell to change duty</div>':''}
      ${grid}
    </div>`;
}

/* ============================================================
   ⚡ AUTO GENERATE ROSTER
   ============================================================ */
async function autoGenerate() {
  if (!confirm('Auto Generate roster? Existing assignments for this period will be replaced.')) return;
  const periods = Cache.get('periods',{}) || {};
  const p = periods[S.periodId];
  if (!p) return;

  const staff = Object.values(Cache.get('staff',{})||{}).filter(s => s.status === 'Active');
  if (!staff.length) return toast('No active staff','error');

  const leaves = Object.values(Cache.get('leave',{})||{}).filter(l => l.status === 'Approved');
  const config = Cache.get('config',{}) || DEFAULT_CONFIG;
  const dates = datesBetween(p.start, p.end);

  const result = {};
  const stats = {};
  staff.forEach(s => {
    stats[s.id] = { total:0, counts:{}, lastDate:null, lastDuty:null, weekly:{} };
  });

  const weekKey = (d) => {
    const dt = new Date(d + 'T00:00:00');
    const jan1 = new Date(dt.getFullYear(), 0, 1);
    return dt.getFullYear() + '-W' + Math.ceil(((dt - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  };

  const onLeave = (sid, d) => leaves.find(l => l.staff_id === sid && d >= l.start && d <= l.end);
  const onSpecialOff = (staff, d) => (staff.specialOffs||[]).includes(d);
  const availableStaff = staff.length;

  // Pick config based on available staff
  let dayCfg;
  if (availableStaff >= 12) dayCfg = config.phlebo_12;
  else if (availableStaff === 11) dayCfg = config.phlebo_11;
  else if (availableStaff === 10) dayCfg = config.phlebo_10;
  else dayCfg = config.phlebo_9;

  for (const date of dates) {
    const wk = weekKey(date);
    const sundayOrHoliday = isSundayOrHoliday(date);

    // Determine required shifts
    let required = [];
    if (sundayOrHoliday) {
      // Sunday/Holiday: 2 M + 2 E + 1 N
      for (let i = 0; i < config.sunday.M; i++) required.push('M');
      for (let i = 0; i < config.sunday.E; i++) required.push('E');
      for (let i = 0; i < config.sunday.N; i++) required.push('N');
    } else {
      // Normal day
      for (let i = 0; i < dayCfg.M; i++) required.push('M');
      for (let i = 0; i < dayCfg.D; i++) required.push('D');
      for (let i = 0; i < dayCfg.E; i++) required.push('E');
      for (let i = 0; i < (dayCfg.X||0); i++) required.push('X');
      const night = dayCfg.N12 ? 'N12' : (dayCfg.N ? 'N' : null);
      if (night) required.push(night);
    }

    // Sort required: hard shifts first (N, N12, D, E4, X) then easy (M, E)
    const hardOrder = { N:0, N12:0, D:1, E4:1, X:2, M:3, E:3 };
    required.sort((a,b) => (hardOrder[a]||9) - (hardOrder[b]||9));

    const assignedToday = new Set();

    for (const code of required) {
      // Build eligible list
      const eligible = staff.filter(s => {
        if (onLeave(s.id, date)) return false;
        if (onSpecialOff(s, date)) return false;
        if (assignedToday.has(s.id)) return false;
        
        // Station-based rules
        if (code === 'D' && s.gender !== 'Female') return false; // D is for Gynee (Female)
        
        // Check shift eligibility
        if (s.shiftType === 'fixed') {
          // Fixed staff: only their fixed shift (with fallback)
          const fixed = s.fixedShift;
          // Special: on Sunday/Holiday, only M, E, N
          if (sundayOrHoliday && !['M','E','N'].includes(fixed)) return false;
          if (!sundayOrHoliday && code === 'N' && fixed !== 'N') return false;
          if (!sundayOrHoliday && code !== fixed) {
            // Allow fallback if fixed shift not needed
            return false;
          }
        } else {
          // Multiple shifts: check priority list
          const prio = s.priorityShifts || [];
          if (!prio.includes(code)) return false;
        }
        
        // Weekly limit
        stats[s.id].weekly[wk] = stats[s.id].weekly[wk] || 0;
        if (stats[s.id].weekly[wk] >= 7) return false;
        
        // Rest
        if (stats[s.id].lastDate === date) return false;
        
        return true;
      });

      // Sort by priority (1st priority gets bonus)
      eligible.sort((a,b) => {
        const aPrio = (a.priorityShifts||[]).indexOf(code);
        const bPrio = (b.priorityShifts||[]).indexOf(code);
        const aScore = aPrio >= 0 ? aPrio : (a.fixedShift === code ? 0 : 99);
        const bScore = bPrio >= 0 ? bPrio : (b.fixedShift === code ? 0 : 99);
        
        // Priority score first
        if (aScore !== bScore) return aScore - bScore;
        
        // Then least duty count for this shift
        const aC = stats[a.id].counts[code] || 0;
        const bC = stats[b.id].counts[code] || 0;
        if (aC !== bC) return aC - bC;
        
        // Then least total
        return stats[a.id].total - stats[b.id].total;
      });

      const chosen = eligible[0];
      if (chosen) {
        result[chosen.id + '_' + date] = code;
        assignedToday.add(chosen.id);
        stats[chosen.id].counts[code] = (stats[chosen.id].counts[code]||0) + 1;
        stats[chosen.id].total++;
        stats[chosen.id].weekly[wk]++;
        stats[chosen.id].lastDate = date;
        stats[chosen.id].lastDuty = code;
      }
    }

    // Fill remaining with OFF or their leave
    staff.forEach(s => {
      if (result[s.id + '_' + date]) return;
      const lv = onLeave(s.id, date);
      if (lv) result[s.id + '_' + date] = lv.type || 'EL';
      else result[s.id + '_' + date] = 'O';
    });

    // If Sunday/Holiday and X still unassigned, convert to OFF
    if (sundayOrHoliday) {
      staff.forEach(s => {
        if (result[s.id + '_' + date] === 'X') result[s.id + '_' + date] = 'O';
      });
    }
  }

  const asg = Cache.get('assignments',{}) || {};
  asg[p.id] = result;
  await Cache.set('assignments', asg);
  audit('GENERATE_ROSTER', 'period', null, Object.keys(result).length + ' assignments');
  notifyAll('Roster Generated', `${Object.keys(result).length} assignments created for ${p.name}`, 'roster');
  toast('Generated ' + Object.keys(result).length + ' assignments ✅');
  render();
}

function showImportDialog() {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>📥 Import Excel Roster</h2>
    <p style="font-size:12px;color:#666;margin-bottom:12px">Select your Excel file (e.g. Phle Aug - Sep2026.xlsx). Staff not in system will be auto-created with mobile from "Contact" column if available.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls">
    <div class="row" style="margin-top:10px">
      <button class="sec" onclick="this.closest('.modal').remove()">Cancel</button>
      <button class="success" onclick="doImport()">Import</button>
    </div>
    <div id="impStatus" style="margin-top:12px;font-size:12px"></div>
  </div>`;
  document.body.appendChild(m);
}

function doImport() {
  const f = document.getElementById('impFile').files[0];
  if (!f) return toast('Select a file','error');
  const periods = Cache.get('periods',{}) || {};
  const p = periods[S.periodId];
  if (!p) return toast('Create period first','error');
  const st = document.getElementById('impStatus');
  st.textContent = 'Reading file...';

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

      let headerIdx = -1;
      for (let i = 0; i < Math.min(15, rows.length); i++) {
        if (rows[i].some(c => String(c).trim() === 'Name')) { headerIdx = i; break; }
      }
      if (headerIdx < 0) { st.innerHTML = '<span style="color:#C0392B">Header "Name" not found</span>'; return; }

      const header = rows[headerIdx];
      const nameCol = header.findIndex(c => String(c).trim() === 'Name');
      const dayCols = [];
      for (let i = nameCol + 1; i < header.length; i++) {
        const v = String(header[i]).trim();
        if (/^\d{1,2}$/.test(v)) dayCols.push({ col: i, day: Number(v) });
        else if (['OFF','PH','CPL','EL','TOTAL','Balance'].includes(v)) break;
      }

      const sd = new Date(p.start + 'T00:00:00');
      const ed = new Date(p.end + 'T00:00:00');
      const dayToDate = {};
      dayCols.forEach(({ day }) => {
        const scan = new Date(sd);
        let last = null;
        while (scan <= ed) {
          if (scan.getDate() === day) last = new Date(scan);
          scan.setDate(scan.getDate() + 1);
        }
        if (last) dayToDate[day] = last.toISOString().slice(0, 10);
      });

      const staff = Cache.get('staff',{}) || {};
      const users = Cache.get('users',{}) || {};
      const asg = Cache.get('assignments',{}) || {};
      const pd = asg[p.id] || {};
      let si = 0, ai = 0;

      for (let r = headerIdx + 1; r < rows.length; r++) {
        const row = rows[r];
        const name = String(row[nameCol] || '').trim();
        if (!name) continue;
        if (/^(Morning|Evening|X|N|EN|ME|PH|CPL|EL|OFF)$/i.test(name)) continue;
        if (/^\d+$/.test(name)) continue;

        let s = Object.values(staff).find(x => x.name === name);
        if (!s) {
          const newId = 's_' + uid();
          const mobile = '0300' + String(1000000 + Math.floor(Math.random()*8999999)).slice(-7);
          s = {
            id: newId, name,
            gender: name.match(/Noreen|Habiba|Qurat|Donia|Bushra|Tasleem|Fatima|Ain/i) ? 'Female' : 'Male',
            mobile, empId: 'PH-' + String(Object.keys(staff).length + 1).padStart(3,'0'),
            designation: 'Phlebotomist', status: 'Active',
            shiftType: 'multi', priorityShifts: ['M','E','E4','N12','D','X'],
            specialOffs: [], cplBalance: 0,
            createdAt: new Date().toISOString()
          };
          staff[newId] = s;
          users[mobile] = { username:mobile, password:'123456', role:'staff', staff_id:newId, name, mobile, active:true };
          si++;
        }

        dayCols.forEach(({ col, day }) => {
          const dt = dayToDate[day];
          if (!dt) return;
          let c = String(row[col] || '').trim().toUpperCase();
          if (!c) c = 'O';
          if (c === 'OFF') c = 'O';
          pd[s.id + '_' + dt] = c;
          ai++;
        });
      }

      await Cache.set('staff', staff);
      await Cache.set('users', users);
      asg[p.id] = pd;
      await Cache.set('assignments', asg);
      audit('IMPORT_EXCEL', 'period', null, si + ' staff, ' + ai + ' assign');
      st.innerHTML = `<span style="color:#27AE60">✅ Imported: ${si} new staff, ${ai} assignments</span>`;
      setTimeout(() => { document.querySelector('.modal').remove(); render(); }, 1500);
    } catch (err) {
      st.innerHTML = '<span style="color:#C0392B">Error: ' + esc(err.message) + '</span>';
    }
  };
  reader.readAsArrayBuffer(f);
}

async function addLeave() {
  const staff_id = document.getElementById('lStaff').value;
  const type = document.getElementById('lType').value;
  const start = document.getElementById('lStart').value;
  const end = document.getElementById('lEnd').value;
  const remarks = document.getElementById('lRem').value;
  if (!start || !end) return toast('Dates required','error');
  if (start > end) return toast('Start must be before end','error');

  const leave = Cache.get('leave',{}) || {};
  const id = 'l_' + uid();
  leave[id] = { id, staff_id, type, start, end, status:'Approved', remarks, at:new Date().toISOString() };
  await Cache.set('leave', leave);
  audit('ADD_LEAVE', 'leave', null, type);

async function addOt() {
  const staff_id = document.getElementById('oStaff').value;
  const date = document.getElementById('oDate').value;
  const start = document.getElementById('oStart').value;
  const end = document.getElementById('oEnd').value;
  const reason = document.getElementById('oReason').value;
  if (!date || !start || !end) return toast('All fields required','error');

  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  const hours = +(mins / 60).toFixed(2);

  const cfg = Cache.get('config',{}) || DEFAULT_CONFIG;
  const cpl = +(hours * (cfg.cpl_per_hour || 0.125)).toFixed(3);

  const ot = Cache.get('overtime',{}) || {};
  const id = 'o_' + uid();
  ot[id] = { id, staff_id, date, start, end, hours, cpl, reason, by:S.user.name, at:new Date().toISOString() };
  await Cache.set('overtime', ot);

  // Add CPL to staff balance
  const staff = Cache.get('staff',{}) || {};
  const s = staff[staff_id];
  if (s) {
    s.cplBalance = +((s.cplBalance || 0) + cpl).toFixed(3);
    await Cache.set('staff', staff);
  }

  audit('ADD_OT', 'overtime', null, `${hours}h, +${cpl} CPL`);
  notifyAll('Overtime Added', `${s?s.name:'Staff'}: ${hours}h overtime (+${cpl} CPL)`, 'overtime');
  toast(`Added ${hours}h (+${cpl} CPL) ✅`);
  render();
}

/* ============================================================
   🔄 EXCHANGE
   ============================================================ */
function viewExchange() {
  const ex = Object.values(Cache.get('exchanges',{})||{});
  const staff = Object.values(Cache.get('staff',{})||{});
  const isSup = S.user.role === 'supervisor';
  const isStaff = S.user.role === 'staff';

  const mine = isStaff 
    ? ex.filter(e => e.requester_id === S.user.staff_id || e.target_id === S.user.staff_id)
    : ex;
  const pending = mine.filter(e => e.status === 'Pending');
  const completed = mine.filter(e => e.status !== 'Pending');

  const renderEx = (e) => {
    const req = staff.find(x => x.id === e.requester_id);
    const tgt = staff.find(x => x.id === e.target_id);
    let actions = '';
    if (isStaff && e.target_id === S.user.staff_id && e.staff_resp === 'Pending') {
      actions = `<button class="success sm" onclick="respondX('${e.id}','Accepted')">✅ Accept</button>
                 <button class="danger sm" onclick="respondX('${e.id}','Rejected')">❌ Reject</button>`;
    } else if (isSup && e.staff_resp === 'Accepted' && e.sup_resp === 'Pending') {
      actions = `<button class="success sm" onclick="approveX('${e.id}','Approved')">✅ Approve</button>
                 <button class="danger sm" onclick="approveX('${e.id}','Rejected')">❌ Reject</button>`;
    }
    return `<div style="padding:12px;border-bottom:1px solid #eee">
      <div style="font-weight:700">${esc(req?req.name:'?')} ↔ ${esc(tgt?tgt.name:'?')}</div>
      <div style="font-size:12px;color:#888;margin:4px 0">${fmtDate(e.date)} · ${e.orig} ↔ ${e.req}</div>
      ${e.reason?`<div style="font-size:11px;color:#666">📝 ${esc(e.reason)}</div>`:''}
      <div style="font-size:11px;margin:6px 0">
        <span class="chip ${e.staff_resp==='Accepted'?'green':e.staff_resp==='Rejected'?'red':''}">Staff: ${e.staff_resp}</span>
        <span class="chip ${e.sup_resp==='Approved'?'green':e.sup_resp==='Rejected'?'red':''}">Supervisor: ${e.sup_resp}</span>
      </div>
      <div><span class="badge b-${e.status.toLowerCase()}">${e.status}</span></div>
      ${actions?`<div style="margin-top:8px;display:flex;gap:6px">${actions}</div>`:''}
    </div>`;
  };

  return `
    ${isStaff ? `<div class="card">
      <h2><span class="ico">🔄</span> Request Exchange</h2>
      <select id="xTarget">${staff.filter(s => s.id !== S.user.staff_id).map(s => 
        `<option value="${s.id}">${esc(s.name)}</option>`
      ).join('')}</select>
      <input id="xDate" type="date">
      <div class="grid2">
        <input id="xOrig" placeholder="My duty (e.g. N12)">
        <input id="xReq" placeholder="Their duty (e.g. M)">
      </div>
      <input id="xReason" placeholder="Reason">
      <button class="block success" onclick="addExchange()">📤 Submit Request</button>
    </div>` : ''}
    <div class="card">
      <h2><span class="ico">⏳</span> Pending (${pending.length})</h2>
      ${pending.length ? pending.map(renderEx).join('') : '<div class="empty">No pending exchanges</div>'}
    </div>
    <div class="card">
      <h2><span class="ico">✅</span> History (${completed.length})</h2>
      ${completed.length ? completed.slice(0, 30).map(renderEx).join('') : '<div class="empty">No history</div>'}
    </div>`;
}

async function addExchange() {
  const target_id = document.getElementById('xTarget').value;
  const date = document.getElementById('xDate').value;
  const orig = document.getElementById('xOrig').value.toUpperCase().trim();
  const req = document.getElementById('xReq').value.toUpperCase().trim();
  const reason = document.getElementById('xReason').value.trim();
  if (!date || !orig || !req) return toast('All fields required','error');

  const ex = Cache.get('exchanges',{}) || {};
  const id = 'x_' + uid();
  ex[id] = {
    id, requester_id: S.user.staff_id, target_id, date,
    orig, req, reason,
    staff_resp: 'Pending', sup_resp: 'Pending', status: 'Pending',
    at: new Date().toISOString()
  };
  await Cache.set('exchanges', ex);

  const staff = Cache.get('staff',{}) || {};
  const requester = staff[S.user.staff_id];
  const target = staff[target_id];
  notifyAll('Exchange Request', `${requester?requester.name:'Staff'} requested exchange with ${target?target.name:'Staff'} on ${fmtDate(date)}`, 'exchange');
  audit('CREATE_EXCHANGE', 'exchange', null, `${orig}↔${req}`);
  toast('Request submitted ✅');
  render();
}

async function respondX(id, resp) {
  const ex = Cache.get('exchanges',{}) || {};
  const e = ex[id];
  if (!e) return;
  e.staff_resp = resp;
  if (resp === 'Rejected') { e.status = 'Rejected'; e.sup_resp = 'Rejected'; }
  await Cache.set('exchanges', ex);
  audit('EXCHANGE_RESPONSE', 'exchange', null, resp);
  toast(resp);
  render();
}

async function approveX(id, resp) {
  const ex = Cache.get('exchanges',{}) || {};
  const e = ex[id];
  if (!e) return;
  e.sup_resp = resp;
  e.status = resp;

  if (resp === 'Approved') {
    const asg = Cache.get('assignments',{}) || {};
    const periods = Cache.get('periods',{}) || {};
    const p = Object.values(periods).find(pp => pp.start <= e.date && pp.end >= e.date);
    if (p && asg[p.id]) {
      const rk = e.requester_id + '_' + e.date;
      const tk = e.target_id + '_' + e.date;
      const rd = asg[p.id][rk] || e.orig;
      const td = asg[p.id][tk] || e.req;
      asg[p.id][rk] = td;
      asg[p.id][tk] = rd;
      await Cache.set('assignments', asg);
    }
  }
  await Cache.set('exchanges', ex);
  
  const staff = Cache.get('staff',{}) || {};
  const r = staff[e.requester_id];
  const t = staff[e.target_id];
  notifyAll('Exchange ' + resp, `${r?r.name:'Staff'} ↔ ${t?t.name:'Staff'} — ${resp}`, 'exchange');
  audit('EXCHANGE_DECISION', 'exchange', null, resp);
  toast(resp);
  render();
}

async function sendChatMsg(type, roomKey) {
  const input = document.getElementById(type === 'group' ? 'chatInput' : 'chatInput2');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const chat = Cache.get('chat',{}) || {};
  const key = type === 'group' ? 'group' : roomKey;
  if (!chat[key]) chat[key] = {};

  const msgId = 'm_' + uid();
  chat[key][msgId] = {
    id: msgId,
    user: S.user.username,
    user_id: S.user.staff_id || 'admin',
    user_name: S.user.name || S.user.username,
    text,
    at: new Date().toISOString()
  };

  await Cache.set('chat', chat);
  input.value = '';
  render();
}

async function sendChatImage(type, roomKey) {
  const fileInput = document.getElementById(type === 'group' ? 'chatFile' : 'chatFile2');
  const file = fileInput?.files?.[0];
  if (!file) return;

  if (file.size > 500000) return toast('Image too large (max 500KB)','error');

  const reader = new FileReader();
  reader.onload = async (e) => {
    const chat = Cache.get('chat',{}) || {};
    const key = type === 'group' ? 'group' : roomKey;
    if (!chat[key]) chat[key] = {};

    const msgId = 'm_' + uid();
    chat[key][msgId] = {
      id: msgId,
      user: S.user.username,
      user_id: S.user.staff_id || 'admin',
      user_name: S.user.name || S.user.username,
      image: e.target.result,
      at: new Date().toISOString()
    };

    await Cache.set('chat', chat);
    fileInput.value = '';
    render();
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   💬 WHATSAPP SHARE (Manual)
   ============================================================ */
function shareWhatsApp(scope) {
  const periods = Object.values(Cache.get('periods',{})||{});
  const p = periods.find(x => x.id === S.periodId);
  if (!p) return toast('No period','error');
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s => s.status === 'Active');
  const dates = datesBetween(p.start, p.end);
  const pd = (Cache.get('assignments',{})[p.id]) || {};
  const s = Cache.get('settings',{}) || {};
  const t = today();

  let text = `*${s.hospital_name}*\n*${s.department}*\n*Roster:* ${p.name}\n\n`;

  if (scope === 'staff') {
    const me = staff.find(x => x.id === S.user.staff_id);
    if (!me) return toast('No profile','error');
    text += `*${me.name}* — Your Schedule:\n`;
    dates.forEach(d => {
      const c = pd[me.id + '_' + d] || '-';
      text += `${fmtDate(d)} (${dayOfWeek(d)}): *${c}*\n`;
    });
  } else if (scope === 'today') {
    text += `*Duties for ${fmtDate(t)}:*\n`;
    staff.forEach(x => {
      const c = pd[x.id + '_' + t] || '-';
      text += `• ${x.name}: *${c}*\n`;
    });
  } else {
    text += `*Full Roster:*\n\n`;
    staff.forEach(x => {
      text += `*${x.name}*:\n`;
      const parts = [];
      dates.forEach(d => {
        const c = pd[x.id + '_' + d] || '-';
        parts.push(`${d.slice(8)}:${c}`);
      });
      text += parts.join(' | ') + '\n\n';
    });
  }

  text += `\n_Shared via ${s.whatsapp_bot||'FlipBotMe'}_`;

  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
  toast('WhatsApp opening...');
}

async function shareWhatsAppToStaff(staffId, message) {
  const staff = Cache.get('staff',{})[staffId];
  if (!staff) return;
  const mobile = (staff.mobile||'').replace(/\D/g,'');
  const url = 'https://wa.me/' + (mobile.startsWith('92')?mobile:'92'+mobile.replace(/^0/,'')) + '?text=' + encodeURIComponent(message);
  window.open(url, '_blank');
}

function exportExcel() {
  const periods = Object.values(Cache.get('periods',{})||{});
  const p = periods.find(x => x.id === S.periodId);
  if (!p) return toast('No period','error');
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s => s.status === 'Active');
  const dates = datesBetween(p.start, p.end);
  const pd = (Cache.get('assignments',{})[p.id]) || {};
  const settings = Cache.get('settings',{}) || {};

  const aoa = [];
  // Row 1: Hospital name (bold, large)
  aoa.push([settings.hospital_name]);
  aoa.push([settings.department + ' — Phlebotomist Duty Roster']);
  aoa.push([]);
  aoa.push(['Roster Period:', p.name, '', 'From:', p.start, 'To:', p.end]);
  aoa.push([]);
  // Header
  const headerRow = ['Sr.', 'Name', 'Mobile'];
  dates.forEach(d => headerRow.push(d.slice(8)));
  headerRow.push('M', 'E', 'E4', 'N12', 'D', 'X', 'OFF', 'CPL', 'EL', 'TOTAL');
  aoa.push(headerRow);

  // Staff rows
  staff.forEach((s, i) => {
    const row = [i + 1, s.name, s.mobile || ''];
    const counts = { M:0, E:0, E4:0, N12:0, D:0, X:0, O:0, CPL:0, EL:0 };
    dates.forEach(d => {
      const c = pd[s.id + '_' + d] || '';
      row.push(c);
      if (counts[c] !== undefined) counts[c]++;
    });
    const total = dates.filter(d => pd[s.id + '_' + d]).length;
    row.push(counts.M, counts.E, counts.E4, counts.N12, counts.D, counts.X, counts.O, counts.CPL, counts.EL, total);
    aoa.push(row);
  });

  // Footer
  aoa.push([]);
  aoa.push(['Generated:', new Date().toLocaleString('en-GB')]);
  aoa.push(['Prepared by:', S.user.name || S.user.username]);
  aoa.push(['Approved by:', '____________________']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // Column widths
  ws['!cols'] = [
    { wch: 5 }, { wch: 22 }, { wch: 14 },
    ...dates.map(() => ({ wch: 5 })),
    { wch: 4 }, { wch: 4 }, { wch: 4 }, { wch: 5 }, { wch: 4 }, { wch: 4 }, { wch: 5 }, { wch: 5 }, { wch: 4 }, { wch: 6 }
  ];
  // Merge title cells
  ws['!merges'] = [
    { s: { r: 0, c: 0 }, e: { r: 0, c: 8 } },
    { s: { r: 1, c: 0 }, e: { r: 1, c: 8 } }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Roster');
  XLSX.writeFile(wb, 'roster-' + p.name.replace(/\s+/g,'_') + '.xlsx');
  audit('EXPORT_EXCEL', 'period', null, p.name);
  toast('Excel downloaded ✅');
}

/* ============================================================
   📄 PDF EXPORT
   ============================================================ */
function exportPDF() {
  const periods = Object.values(Cache.get('periods',{})||{});
  const p = periods.find(x => x.id === S.periodId);
  if (!p) return toast('No period','error');
  const staff = Object.values(Cache.get('staff',{})||{}).filter(s => s.status === 'Active');
  const dates = datesBetween(p.start, p.end);
  const pd = (Cache.get('assignments',{})[p.id]) || {};
  const settings = Cache.get('settings',{}) || {};

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });

  // Header - Hospital name in red
  doc.setFontSize(18).setTextColor('#C8102E').setFont(undefined, 'bold');
  doc.text(settings.hospital_name || 'Hospital', 40, 40);
  doc.setFontSize(11).setTextColor('#1E5BA8').setFont(undefined, 'normal');
  doc.text(settings.department || '', 40, 58);
  doc.setFontSize(13).setTextColor('#222').setFont(undefined, 'bold');
  doc.text('Phlebotomist Duty Roster — ' + p.name, 40, 78);
  doc.setFontSize(9).setTextColor('#666').setFont(undefined, 'normal');
  doc.text(`Period: ${fmtDate(p.start)} to ${fmtDate(p.end)}  |  Generated: ${new Date().toLocaleString('en-GB')}`, 40, 92);

  // Draw red line
  doc.setDrawColor(200, 16, 46).setLineWidth(2);
  doc.line(40, 100, doc.internal.pageSize.width - 40, 100);

  // Table
  const head = [['Name', ...dates.map(d => d.slice(8)), 'O', 'CPL', 'EL', 'Tot']];
  const body = staff.map(s => {
    const row = [s.name];
    let o = 0, cpl = 0, el = 0, tot = 0;
    dates.forEach(d => {
      const c = pd[s.id + '_' + d] || '';
      row.push(c);
      if (c === 'O') o++;
      else if (c === 'CPL') cpl++;
      else if (c === 'EL') el++;
      if (c) tot++;
    });
    row.push(o, cpl, el, tot);
    return row;
  });

  doc.autoTable({
    head, body, startY: 115,
    styles: { fontSize: 5.5, cellPadding: 1.8, halign: 'center', lineColor: [232, 235, 242], lineWidth: 0.2 },
    headStyles: { fillColor: [200, 16, 46], textColor: 255, fontSize: 5.5, fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [250, 251, 253] },
    columnStyles: { 0: { halign: 'left', cellWidth: 95, fontStyle: 'bold' } },
    margin: { left: 20, right: 20, top: 40 }
  });

  // Footer
  const fy = doc.lastAutoTable.finalY + 25;
  doc.setFontSize(9).setTextColor('#333');
  doc.text(`Generated: ${new Date().toLocaleDateString('en-GB')}`, 40, fy);
  doc.text(`Prepared by: ${S.user.name || S.user.username}`, 250, fy);
  doc.text('Approved by: ____________________', 480, fy);
  
  doc.setFontSize(7).setTextColor('#999');
  doc.text(`${settings.hospital_name} | ${settings.address || ''}`, 40, fy + 20);

  doc.save('roster-' + p.name.replace(/\s+/g,'_') + '.pdf');
  audit('EXPORT_PDF', 'period', null, p.name);
  toast('PDF downloaded ✅');
}

/* ============================================================
   📊 REPORTS
   ============================================================ */
function viewReports() {
  const periods = Object.values(Cache.get('periods',{})||{});
  const staff = Object.values(Cache.get('staff',{})||{});
  const asg = Cache.get('assignments',{})||{};
  const leave = Object.values(Cache.get('leave',{})||{});
  const ot = Object.values(Cache.get('overtime',{})||{});
  const ex = Object.values(Cache.get('exchanges',{})||{});

  const pid = S.periodId || (periods[0]?.id);
  const p = periods.find(x => x.id === pid);
  const pd = asg[pid] || {};

  let rows = [];
  if (p) {
    const dates = datesBetween(p.start, p.end);
    staff.filter(s => s.status === 'Active').forEach(s => {
      const c = { M:0, E:0, N:0, D:0, X:0, O:0, CPL:0, EL:0, total:0 };
      dates.forEach(d => {
        const code = pd[s.id + '_' + d] || '';
        if (code === 'M') c.M++;
        else if (code === 'E') c.E++;
        else if (['N','N12'].includes(code)) c.N++;
        else if (code === 'D') c.D++;
        else if (code === 'X') c.X++;
        else if (code === 'O') c.O++;
        else if (code === 'CPL') c.CPL++;
        else if (code === 'EL') c.EL++;
        if (code) c.total++;
      });
      rows.push({ name: s.name, cplBalance: s.cplBalance || 0, ...c });
    });
  }

  const totalOT = ot.reduce((sum, o) => sum + (o.hours || 0), 0);
  const totalOTcpl = ot.reduce((sum, o) => sum + (o.cpl || 0), 0);

  return `
    <div class="card">
      <h2><span class="ico">📊</span> Monthly Summary</h2>
      ${p ? `<div style="font-size:12px;color:#666;margin-bottom:8px">${esc(p.name)} (${fmtDate(p.start)} → ${fmtDate(p.end)})</div>` : ''}
      <div class="scroll-x">
        <table>
          <thead><tr><th>Staff</th><th>M</th><th>E</th><th>N</th><th>D</th><th>X</th><th>O</th><th>CPL</th><th>EL</th><th>Tot</th><th>CPL Bal</th></tr></thead>
          <tbody>${rows.map(r => `<tr>
            <td style="text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</td>
            <td>${r.M}</td><td>${r.E}</td><td>${r.N}</td>
            <td>${r.D}</td><td>${r.X}</td><td>${r.O}</td>
            <td>${r.CPL}</td><td>${r.EL}</td><td><b>${r.total}</b></td>
            <td><b style="color:${r.cplBalance>0?'#27AE60':'#666'}">${r.cplBalance.toFixed(2)}</b></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">⏱</span> Overtime Report</h2>
      <div class="stats" style="grid-template-columns:1fr 1fr">
        <div class="stat green"><div class="num">${totalOT.toFixed(1)}h</div><div class="label">Total OT Hours</div></div>
        <div class="stat orange"><div class="num">${totalOTcpl.toFixed(2)}</div><div class="label">CPL Earned</div></div>
      </div>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Staff</th><th>Date</th><th>Hours</th><th>CPL</th><th>Reason</th></tr></thead>
          <tbody>${ot.slice(0, 30).map(o => {
            const s = staff.find(x => x.id === o.staff_id);
            return `<tr>
              <td>${esc(s?s.name:'?')}</td>
              <td>${fmtDate(o.date)}</td>
              <td><b>${o.hours}h</b></td>
              <td><span class="chip orange">+${o.cpl}</span></td>
              <td>${esc(o.reason||'')}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="5">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">🏖</span> Leave Report</h2>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Staff</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Status</th></tr></thead>
          <tbody>${leave.slice(0, 30).map(l => {
            const s = staff.find(x => x.id === l.staff_id);
            const days = Math.ceil((new Date(l.end) - new Date(l.start)) / 86400000) + 1;
            return `<tr>
              <td>${esc(s?s.name:'?')}</td>
              <td><span class="chip">${l.type}</span></td>
              <td>${fmtDate(l.start)}</td>
              <td>${fmtDate(l.end)}</td>
              <td><b>${days}</b></td>
              <td><span class="badge b-${l.status.toLowerCase()}">${l.status}</span></td>
            </tr>`;
          }).join('') || '<tr><td colspan="6">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">🔄</span> Exchange Report</h2>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Requester</th><th>Target</th><th>Date</th><th>Orig</th><th>Req</th><th>Staff</th><th>Sup</th><th>Status</th></tr></thead>
          <tbody>${ex.slice(0, 30).map(e => {
            const r = staff.find(x => x.id === e.requester_id);
            const t = staff.find(x => x.id === e.target_id);
            return `<tr>
              <td>${esc(r?r.name:'?')}</td>
              <td>${esc(t?t.name:'?')}</td>
              <td>${fmtDate(e.date)}</td>
              <td>${e.orig}</td>
              <td>${e.req}</td>
              <td>${e.staff_resp}</td>
              <td>${e.sup_resp}</td>
              <td><span class="badge b-${e.status.toLowerCase()}">${e.status}</span></td>
            </tr>`;
          }).join('') || '<tr><td colspan="8">No data</td></tr>'}</tbody>
        </table>
      </div>
    </div>

    ${S.user.role === 'supervisor' ? `<div class="card">
      <h2><span class="ico">📤</span> Export Reports</h2>
      <div class="grid2">
        <button onclick="exportExcel()">📊 Excel</button>
        <button class="blue" onclick="exportPDF()">📄 PDF</button>
      </div>
    </div>` : ''}`;
}

/* ============================================================
   🔬 TECHNOLOGIST ROSTER (الگ tab)
   ============================================================ */
function viewTechnologist() {
  const isSup = S.user.role === 'supervisor';
  const techs = Object.values(Cache.get('technologists',{})||{});
  const periods = Object.values(Cache.get('techPeriods',{})||{}).sort((a,b) => b.start.localeCompare(a.start));

  return `
    <div class="card">
      <h2><span class="ico">🔬</span> Technologist Roster</h2>
      <div class="help">Separate roster for Lab Technologists. Same rules as Phlebotomist.</div>
      <div class="empty" style="padding:20px">
        <div class="big">🔬</div>
        <div style="font-weight:700;color:#666;margin-bottom:6px">Coming Soon</div>
        <div style="font-size:12px;color:#999">Technologist roster structure is ready.<br>Staff and shifts will be configured later.</div>
        ${isSup ? `<button class="sec" style="margin-top:14px" onclick="go('settings')">⚙ Configure in Settings</button>` : ''}
      </div>
    </div>
    ${techs.length ? `<div class="card"><h2>Technologists (${techs.length})</h2>${techs.map(t => `<div class="staff-card"><div class="avatar">${initials(t.name)}</div><div class="info"><div class="name">${esc(t.name)}</div><div class="detail">${esc(t.designation||'Technologist')}</div></div></div>`).join('')}</div>` : ''}
    ${periods.length ? `<div class="card"><h2>Periods</h2>${periods.map(p => `<div style="padding:8px;border-bottom:1px solid #eee"><b>${esc(p.name)}</b> <span class="badge b-${p.status.toLowerCase()}">${p.status}</span></div>`).join('')}</div>` : ''}`;
}

/* ============================================================
   📜 AUDIT LOG
   ============================================================ */
function viewAudit() {
  if (S.user.role !== 'supervisor') return '<div class="card"><div class="empty">Access denied</div></div>';
  const log = Object.values(Cache.get('audit',{})||{}).sort((a,b) => new Date(b.at) - new Date(a.at));
  
  return `
    <div class="card">
      <h2><span class="ico">📜</span> Audit Log (${log.length})</h2>
      <input id="auditSearch" placeholder="🔍 Search..." oninput="filterAudit()">
      <div style="max-height:70vh;overflow-y:auto" id="auditList">
        ${log.slice(0, 100).map(l => `
          <div class="notif-item" data-search="${esc((l.action + ' ' + l.user_name + ' ' + (l.new||'')).toLowerCase())}">
            <div class="title">${esc(l.action)}</div>
            <div class="desc">
              👤 ${esc(l.user_name||l.user)} 
              ${l.old||l.new ? `· <span style="color:#888">${esc(l.old||'—')} → ${esc(l.new||'—')}</span>` : ''}
            </div>
            <div class="time">${fmtTime(l.at)}</div>
          </div>
        `).join('')}
      </div>
      <button class="sec block" style="margin-top:10px" onclick="clearAudit()">🗑 Clear Old Logs</button>
    </div>`;
}

function filterAudit() {
  const q = document.getElementById('auditSearch').value.toLowerCase();
  document.querySelectorAll('#auditList .notif-item').forEach(el => {
    el.style.display = el.dataset.search.includes(q) ? 'block' : 'none';
  });
}

async function clearAudit() {
  if (!confirm('Clear audit logs older than 30 days?')) return;
  const log = Cache.get('audit',{}) || {};
  const cutoff = Date.now() - 30*24*60*60*1000;
  const filtered = {};
  Object.values(log).forEach(l => {
    if (new Date(l.at).getTime() > cutoff) filtered[l.id] = l;
  });
  await Cache.set('audit', filtered);
  toast('Old logs cleared');
  render();
}

/* ============================================================
   ⚙ SETTINGS
   ============================================================ */
function viewSettings() {
  if (S.user.role !== 'supervisor') return '<div class="card"><div class="empty">Access denied</div></div>';
  const s = Cache.get('settings',{}) || {};
  const holidays = Object.values(Cache.get('holidays',{})||{});
  const shifts = Cache.get('shifts',{}) || DEFAULT_SHIFTS;

  return `
    <div class="card">
      <h2><span class="ico">🏥</span> Hospital Settings</h2>
      <input id="stHosp" placeholder="Hospital Name" value="${esc(s.hospital_name||'')}">
      <input id="stDept" placeholder="Department" value="${esc(s.department||'')}">
      <input id="stAddr" placeholder="Address" value="${esc(s.address||'')}">
      <input id="stWa" placeholder="WhatsApp Bot Name" value="${esc(s.whatsapp_bot||'')}">
      <button class="block success" onclick="saveSettings()">💾 Save Settings</button>
    </div>

    <div class="card">
      <h2><span class="ico">🎉</span> Gazetted Holidays (2026)</h2>
      <div class="help">Roster will apply Sunday rules on these dates</div>
      ${holidays.length ? holidays.map(h => `
        <div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee">
          <div style="flex:1">
            <b>${esc(h.name)}</b>
            <div style="font-size:11px;color:#888">${fmtDate(h.date)}</div>
          </div>
          <button class="danger sm" onclick="delHoliday('${h.id}')">🗑</button>
        </div>
      `).join('') : '<div class="empty">No holidays added</div>'}
      <button class="sec block" onclick="showAddHoliday()">➕ Add Holiday</button>
    </div>

    <div class="card">
      <h2><span class="ico">⏰</span> Shift Timings</h2>
      ${Object.values(shifts).slice(0, 8).map(sh => `
        <div style="padding:8px;border-bottom:1px solid #eee;font-size:12px">
          <b>${sh.code}</b> — ${sh.name}
          <span style="color:#888">${sh.start||''}${sh.end?' - '+sh.end:''}</span>
        </div>
      `).join('')}
      <button class="sec block" onclick="showEditShifts()">✏️ Edit Shifts</button>
    </div>

    <div class="card">
      <h2><span class="ico">💾</span> Data Backup</h2>
      <button class="sec block" style="margin-bottom:8px" onclick="exportAllData()">📤 Export Backup (JSON)</button>
      <button class="sec block" onclick="importAllData()">📥 Import Backup</button>
      <div class="help" style="margin-top:8px">Firebase auto-backup is always active.</div>
    </div>

    <div class="card">
      <h2><span class="ico">👤</span> User Accounts (${Object.keys(Cache.get('users',{})||{}).length})</h2>
      <div style="max-height:300px;overflow-y:auto">
        ${Object.values(Cache.get('users',{})||{}).map(u => `
          <div style="padding:8px;border-bottom:1px solid #eee;font-size:12px">
            <b>${esc(u.name || u.username)}</b>
            <span class="chip">${u.role}</span>
            <div style="color:#888;font-size:11px">📱 ${esc(u.username)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">ℹ</span> About</h2>
      <div style="font-size:12px;color:#666;line-height:1.7">
        <b>${esc(s.app_title||'Phlebotomist Roster')}</b><br>
        Version 2.0<br>
        ${esc(s.hospital_name||'')}<br>
        Data synced via Firebase
      </div>
    </div>`;
}

async function saveSettings() {
  const s = Cache.get('settings',{}) || {};
  s.hospital_name = document.getElementById('stHosp').value;
  s.department = document.getElementById('stDept').value;
  s.address = document.getElementById('stAddr').value;
  s.whatsapp_bot = document.getElementById('stWa').value;
  await Cache.set('settings', s);
  audit('EDIT_SETTINGS', 'settings', null, s.hospital_name);
  toast('Saved ✅');
  render();
}

function showAddHoliday() {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>➕ Add Gazetted Holiday</h2>
    <input id="hName" placeholder="Holiday Name (e.g. Pakistan Day)">
    <input id="hDate" type="date">
    <div class="row">
      <button class="sec" onclick="this.closest('.modal').remove()">Cancel</button>
      <button class="success" onclick="saveHoliday()">Save</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}

async function saveHoliday() {
  const name = document.getElementById('hName').value.trim();
  const date = document.getElementById('hDate').value;
  if (!name || !date) return toast('All fields required','error');
  const holidays = Cache.get('holidays',{}) || {};
  const id = 'h_' + uid();
  holidays[id] = { id, name, date, active: true };
  await Cache.set('holidays', holidays);
  audit('ADD_HOLIDAY', 'holiday', null, `${name} (${date})`);
  document.querySelector('.modal').remove();
  toast('Holiday added ✅');
  render();
}

async function delHoliday(id) {
  if (!confirm('Delete this holiday?')) return;
  const holidays = Cache.get('holidays',{}) || {};
  delete holidays[id];
  await Cache.set('holidays', holidays);
  toast('Deleted');
  render();
}

function showEditShifts() {
  const shifts = Cache.get('shifts',{}) || DEFAULT_SHIFTS;
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-c">
    <h2>✏️ Edit Shift Timings</h2>
    ${Object.values(shifts).slice(0, 8).map(sh => `
      <div style="padding:10px;border-bottom:1px solid #eee;margin-bottom:8px">
        <b>${sh.code}</b> — ${sh.name}
        <div class="grid2" style="margin-top:6px">
          <input type="time" value="${sh.start||''}" onchange="updateShift('${sh.code}','start',this.value)">
          <input type="time" value="${sh.end||''}" onchange="updateShift('${sh.code}','end',this.value)">
        </div>
      </div>
    `).join('')}
    <button class="success block" onclick="this.closest('.modal').remove();toast('Saved')">✅ Done</button>
  </div>`;
  document.body.appendChild(m);
}

async function updateShift(code, field, value) {
  const shifts = Cache.get('shifts',{}) || DEFAULT_SHIFTS;
  if (shifts[code]) {
    shifts[code][field] = value;
    await Cache.set('shifts', shifts);
  }
}

async function exportAllData() {
  const data = {};
  ['users','staff','technologists','duties','periods','assignments','techPeriods','techAssignments',
   'leave','overtime','exchanges','audit','settings','notifications','chat','holidays','shifts',
   'stations','config'].forEach(k => data[k] = Cache.get(k));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'phleb-backup-' + today() + '.json';
  a.click();
  audit('EXPORT_BACKUP', 'system', null, null);
  toast('Backup downloaded ✅');
}

function importAllData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json';
  inp.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!confirm('This will REPLACE all current data. Continue?')) return;
    const r = new FileReader();
    r.onload = async (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        for (const k of Object.keys(data)) {
          if (data[k]) await Cache.set(k, data[k]);
        }
        audit('IMPORT_BACKUP', 'system', null, null);
        toast('Backup restored ✅');
        setTimeout(() => render(), 500);
      } catch (err) { toast('Invalid file','error'); }
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============================================================
   🚀 BOOT
   ============================================================ */
Cache.init();

try {
  const saved = localStorage.getItem('phleb_user');
  if (saved) S.user = JSON.parse(saved);
} catch {}

setTimeout(() => {
  render();
  setInterval(() => { if (S.user) render(); }, 15000);
}, 1200);

</script>
